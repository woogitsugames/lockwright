<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sodowa · warsztat</title>
<link rel="stylesheet" href="../shared/fonts.css"><link rel="stylesheet" href="sodowa.css">
<style>
.board svg{display:block;width:100%;height:auto}
.detail{margin:8px 12px 0;padding:12px 14px 14px;background:var(--noc);border:2px solid var(--papier);border-radius:4px 7px 5px 8px/8px 4px 7px 5px;display:grid;grid-template-columns:112px 1fr;gap:4px 14px}
.detail h2{font:600 24px/1 "Fraunces",serif;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 48}
.detail h2 span{font:italic 400 13px "Bitter",serif;color:var(--popiol);margin-left:6px}
.detail p{font:400 14px/1.35 "Bitter",serif;color:var(--papier);margin-top:5px}
.detail p.q{font-style:italic;color:var(--sodowa)}
.detail .acts{grid-column:1/-1;display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-top:10px}
.detail .acts .btn{justify-content:center;font-size:17px}
.meta{font:500 12.5px/1.3 "Bitter",serif;color:var(--popiol);margin-top:6px}
.meta b{color:var(--papier);font-weight:600}
@media (orientation:landscape){
  .page.ws .top{padding-top:4px;padding-bottom:2px}
  .page.ws .board{padding:0 12px}
  .page.ws .board svg{width:100%;height:auto}
  .page.ws .detail{margin:6px 12px 0;padding:6px 10px;grid-template-columns:auto minmax(0,1fr) 400px;align-items:center}
  .page.ws .detail > svg{display:none}
  .page.ws .detail h2{font-size:19px}
  .page.ws .detail p.q{margin-top:2px;font-size:13px}
  .page.ws .detail .meta{display:none}
  .page.ws .detail .acts{grid-column:3;margin:0}
  .page.ws .detail .acts .btn{min-height:48px}
}
</style>
</head><body>
<main class="page ws">
  <header class="top">
    <button class="tap" aria-label="Wróć"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
    <div class="bar-t"><span class="kick">Furgonetka · tablica narzędzi</span><span class="ttl">Co dziś bierzemy?</span></div>
    <div class="coins"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="var(--noc)" stroke="var(--sodowa)" stroke-width="2"/><circle cx="9.5" cy="13" r="3.2" fill="none" stroke="var(--sodowa)" stroke-width="2"/><path d="M12.7 13h7.5M17.5 13v3M20 13v2.2" fill="none" stroke="var(--sodowa)" stroke-width="2"/></svg><span>312</span></div>
  </header>

  <section class="board" aria-label="Tablica narzędzi">
    <svg viewBox="0 0 412 566" id="boardSvg">
      <defs>
        <pattern id="peg" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1.9" fill="var(--atrament)"/></pattern>
        <pattern id="wood" width="150" height="18" patternUnits="userSpaceOnUse"><path d="M2 5.2C30 3 58 6.8 92 4.6C60 6.6 30 5.8 2 5.2Z M96 4.8C112 4 130 6 148 5C130 6.4 112 5.6 96 4.8Z M8 13C34 11 60 15.6 104 12.6C64 15 36 13.8 8 13Z" fill="var(--cegla)" stroke="var(--cegla)" stroke-width="1.1"/></pattern>
        <pattern id="woodStick" width="60" height="6" patternUnits="userSpaceOnUse"><rect width="60" height="6" fill="var(--cegla)"/><path d="M0 3C20 2 40 4 60 3" stroke="var(--papier)" stroke-width=".9" fill="none"/></pattern>
        <filter id="lino" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
        <filter id="grainF"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .11 0 0 0 0 .09 0 0 0 0 .1 0 0 0 -1.7 1.08"/></filter>
        <!-- TOOL SILHOUETTES (160x40). fill/stroke via vars so the same drawing serves owned, shadow and locked -->
        <g id="t-angle"><!-- napinacz kątowy: L-strip, line knurl -->
          <path d="M6 12H140V34H130V22H6Z" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2.4" stroke-dasharray="var(--td,none)" stroke-linejoin="round"/>
          <path d="M16 13.5v7M24 13.5v7M32 13.5v7M40 13.5v7M48 13.5v7" stroke="var(--tk,var(--atrament))" stroke-width="1.6"/></g>
        <g id="t-hook"><!-- haczyk: round handle, thin shaft, hook 60° -->
          <rect x="4" y="13" width="56" height="16" rx="8" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2.4" stroke-dasharray="var(--td,none)"/>
          <path d="M60 21H138L146 9" fill="none" stroke="var(--ts,var(--atrament))" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M60 21H138L146 9" fill="none" stroke="var(--tf,var(--papier))" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 15v12M24 15v12M32 15v12M40 15v12M48 15v12" stroke="var(--tk,var(--atrament))" stroke-width="1.6"/></g>
        <g id="t-peg"><!-- podważka kołkowa: wooden stick with a cut peg -->
          <path d="M6 14H122L134 17V25L122 28H6Z" fill="var(--tw,url(#woodStick))" stroke="var(--ts,var(--atrament))" stroke-width="2.4" stroke-dasharray="var(--td,none)" stroke-linejoin="round"/>
          <path d="M134 17H146L150 21L146 25H134" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2.2" stroke-linejoin="round"/></g>
        <g id="t-ward"><!-- sonda przelotowa: thin wire + square flag; 3 spare tips -->
          <rect x="4" y="14" width="44" height="14" rx="2" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2.4"/>
          <path d="M48 21H128" stroke="var(--ts,var(--atrament))" stroke-width="5"/><path d="M48 21H128" stroke="var(--tf,var(--papier))" stroke-width="1.6"/>
          <rect x="128" y="10" width="14" height="14" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2.4"/>
          <g fill="var(--tk,var(--atrament))"><circle cx="13" cy="21" r="1.8"/><circle cx="21" cy="21" r="1.8"/><circle cx="29" cy="21" r="1.8"/><circle cx="37" cy="21" r="1.8"/></g></g>
        <g id="t-ripple"><!-- falownik: three gentle humps, dot knurl -->
          <rect x="4" y="13" width="50" height="16" rx="3" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2.4" stroke-dasharray="var(--td,none)"/>
          <path d="M54 24H92C98 24 100 13 106 13S114 24 120 24 128 13 134 13 142 24 148 24" fill="none" stroke="var(--ts,var(--atrament))" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M54 24H92C98 24 100 13 106 13S114 24 120 24 128 13 134 13 142 24 148 24" fill="none" stroke="var(--tf,var(--papier))" stroke-width="3" stroke-linecap="round"/>
          <g fill="var(--tk,var(--atrament))"><circle cx="14" cy="18" r="1.7"/><circle cx="24" cy="18" r="1.7"/><circle cx="34" cy="18" r="1.7"/><circle cx="44" cy="18" r="1.7"/><circle cx="19" cy="24" r="1.7"/><circle cx="29" cy="24" r="1.7"/><circle cx="39" cy="24" r="1.7"/></g></g>
        <g id="t-lever"><!-- korba dźwigniowa: thick bar with a knee + thin bar with a flag, crossed -->
          <path d="M8 30L110 14L124 22" fill="none" stroke="var(--ts,var(--atrament))" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M8 30L110 14L124 22" fill="none" stroke="var(--tf,var(--papier))" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M12 10L140 30" stroke="var(--ts,var(--atrament))" stroke-width="5.5" stroke-linecap="round"/><path d="M12 10L140 30" stroke="var(--tf,var(--papier))" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M138 29.5l10 1.5-2 9-10-1.5z" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2"/></g>
        <g id="t-bar"><!-- napinacz listwowy: straight thick bar, twisted tip, cross knurl -->
          <rect x="4" y="15" width="128" height="12" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2.4" stroke-dasharray="var(--td,none)"/>
          <path d="M132 15L146 19V23L132 27Z" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2.4" stroke-dasharray="var(--td,none)"/>
          <path d="M14 17l6 8M20 17l-6 8M30 17l6 8M36 17l-6 8M46 17l6 8M52 17l-6 8" stroke="var(--tk,var(--atrament))" stroke-width="1.4"/></g>
        <g id="t-crown"><!-- koronka: tube with one tooth + ring; ring knurl -->
          <rect x="4" y="12" width="40" height="18" rx="9" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2.4" stroke-dasharray="var(--td,none)"/>
          <rect x="44" y="15" width="84" height="12" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2.4" stroke-dasharray="var(--td,none)"/>
          <rect x="96" y="11" width="10" height="20" fill="var(--tf,var(--papier))" stroke="var(--ts,var(--atrament))" stroke-width="2.4" stroke-dasharray="var(--td,none)"/>
          <path d="M128 15h10v-6h6v6M128 27h16" fill="none" stroke="var(--ts,var(--atrament))" stroke-width="2.4" stroke-dasharray="var(--td,none)"/>
          <path d="M16 13v16M26 13v16" stroke="var(--tk,var(--atrament))" stroke-width="1.4" stroke-dasharray="var(--td,none)"/></g>
      </defs>

      <!-- rear window of the van: the street under the sodium lamp -->
      <rect x="0" y="0" width="412" height="566" fill="var(--atrament)"/>
      <g filter="url(#lino)">
        <path d="M14 70V26Q14 8 34 8H378Q398 8 398 26V70Z" fill="var(--noc)" stroke="var(--papier)" stroke-width="2"/>
        <!-- tenement roofline -->
        <path d="M16 70V44H52V34H60V44H92V30L112 22L132 30V70Z M226 70V36H262V28H270V36H312V48H352V40H396V70Z" fill="var(--atrament)"/>
        <rect x="64" y="50" width="10" height="12" fill="var(--sodowa)"/><rect x="290" y="44" width="10" height="12" fill="var(--papier)"/>
        <!-- lamp post and the light it throws -->
        <path d="M178 70V22Q178 16 186 16H202" fill="none" stroke="var(--papier)" stroke-width="3"/>
        <path d="M196 14h16l-3 6h-10z" fill="var(--papier)" stroke="var(--atrament)" stroke-width="1.4"/>
        <path d="M200 21L176 70H240L210 21Z" fill="var(--sodowa)" opacity="1"/>
        <path d="M188 46l-6 4M206 40l1 7M222 52l6 4" stroke="var(--atrament)" stroke-width="1.6"/>
      </g>
      <text x="300" y="66" font-size="11" fill="var(--popiol)" font-style="italic">tylna szyba</text>

      <!-- the pegboard (wood, lit by the street lamp) -->
      <g transform="translate(1.2 -0.8)" filter="url(#lino)">
        <rect x="8" y="78" width="396" height="482" class="pb" fill="var(--sodowa)"/>
        <rect x="8" y="78" width="396" height="482" class="pb" fill="url(#wood)"/>
      </g>
      <rect x="8" y="78" width="396" height="482" class="pb" fill="url(#peg)" opacity=".5"/>
      <rect x="8" y="78" width="396" height="482" class="pb" fill="none" stroke="var(--atrament)" stroke-width="3"/>

      <!-- slot helper: painted shadow (5S board), the tool, a paper tag -->
      <g id="slots" font-family="Bitter"></g>

      <rect x="8" y="78" width="396" height="482" class="pb" filter="url(#grainF)" opacity=".2" style="mix-blend-mode:multiply"/>
    </svg>
  </section>

  <section class="detail" aria-label="Wybrane narzędzie">
    <svg viewBox="0 0 112 112" width="112" height="112" style="grid-row:1/3">
      <!-- zoom on the worn tip: burrs + one notch per 20 lost points -->
      <rect x="1" y="1" width="110" height="110" fill="var(--sodowa)" stroke="var(--papier)" stroke-width="2"/>
      <path d="M-4 78H70C82 78 88 72 94 58L100 44" fill="none" stroke="var(--atrament)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-4 78H70C82 78 88 72 94 58L100 44" fill="none" stroke="var(--papier)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M38 72v12" stroke="var(--atrament)" stroke-width="3"/>
      <path d="M95 64l5 4 1-7 5 3 0-7 5 2" fill="none" stroke="var(--atrament)" stroke-width="2.2"/>
      <path d="M88 52l6-2M92 46l5 0" stroke="var(--atrament)" stroke-width="1.8"/>
      <text x="8" y="22" font-size="11" fill="var(--atrament)" font-style="italic">zadziory</text>
      <path d="M52 24c18 0 30 8 40 20" fill="none" stroke="var(--atrament)" stroke-width="1.4" stroke-dasharray="3 3"/>
    </svg>
    <div>
      <h2>Haczyk <span>stan 62 ze 100</span></h2>
      <p class="q">„Grot zaczyna drapać. Za piątaka będzie jak nowy.”</p>
      <div class="meta">Otwiera: <b>wkładki bębenkowe, płytkowe</b> · naprawa <b>5</b> monet</div>
    </div>
    <div class="acts">
      <button class="btn primary"><svg class="ico" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 22L18 8l4 4L8 26z"/><path d="M9 19l2 2M12 16l2 2M15 13l2 2"/></svg>Naprawię — 5</button>
      <button class="btn">Biorę jak jest</button>
    </div>
  </section>
</main>
<script>
// [col,row,id,name,state,line2(state),line3(opens)]
const tools=[
 [0,0,'t-angle','Napinacz kątowy','own','od zawsze w kieszeni','otwiera: wkładki, płytki'],
 [1,0,'t-hook','Haczyk','sel','stan 62 · 1 nacięcie','otwiera: wkładki, płytki'],
 [0,1,'t-peg','Podważka kołkowa','own','stan 90','otwiera: zamki drewniane'],
 [1,1,'t-ward','Sonda przelotowa','own','stan 100 · 3 groty','otwiera: zamki zapadkowe'],
 [0,2,'t-ripple','Falownik','buy','350','fala: kilka płytek naraz'],
 [1,2,'t-lever','Korba dźwigniowa','buy','500 · brakuje 188','otwiera: zamki dźwigniowe'],
 [0,3,'t-bar','Napinacz listwowy','lock','wisi po pierwszym t4','wąski kanał, t5 i wyżej'],
 [1,3,'t-crown','Koronka','lock','wisi po pierwszym t4','otwiera: zamki rurkowe'],
];
const NS='http://www.w3.org/2000/svg', g=document.getElementById('slots');
const h=(tag,a,txt)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt)e.textContent=txt;return e};
const F='font-variation-settings:"SOFT" 100,"WONK" 1';
const L=matchMedia('(orientation:landscape)').matches;
if(L){ document.getElementById('boardSvg').setAttribute('viewBox','0 74 808 252');
  document.querySelectorAll('.pb').forEach(e=>{e.setAttribute('width',792);e.setAttribute('height',246)}); }
for(const [c,r,id,name,st,l2,l3] of tools){
  const k=r*2+c, cc=L?k%4:c, rr=L?Math.floor(k/4):r; const x=16+cc*196, y=90+rr*118, s=h('g',{transform:`translate(${x} ${y})`});
  if(st==='sel'){ s.appendChild(h('rect',{x:-5,y:-6,width:194,height:114,fill:'none',stroke:'var(--atrament)','stroke-width':5}));
                  s.appendChild(h('rect',{x:-1,y:-2,width:186,height:106,fill:'none',stroke:'var(--papier)','stroke-width':2})); }
  s.appendChild(h('path',{d:'M40 4v10M120 4v10',stroke:'var(--atrament)','stroke-width':4,'stroke-linecap':'round'}));
  if(st==='lock'){
    // only the painted shadow hangs here: the tool is not ours yet
    s.appendChild(h('use',{href:'#'+id,x:8,y:2,style:'--tf:var(--atrament);--ts:var(--atrament);--tk:var(--atrament);--tw:var(--atrament)'}));
  } else {
    s.appendChild(h('use',{href:'#'+id,x:9,y:5,style:'--tf:var(--atrament);--ts:var(--atrament);--tk:var(--atrament);--tw:var(--atrament)'}));
    s.appendChild(h('use',{href:'#'+id,x:4,y:0}));
    if(st==='sel'){ // wear on the hanging tool too: one notch per 20 lost points + burrs on the tip
      s.appendChild(h('path',{d:'M100 17v8',stroke:'var(--atrament)','stroke-width':3}));
      s.appendChild(h('path',{d:'M147 14l3 2 0-4 3 2',fill:'none',stroke:'var(--atrament)','stroke-width':1.8}));
    }
  }
  const dark= st==='lock';
  s.appendChild(h('rect',{x:2,y:48,width:180,height:56,fill:dark?'var(--atrament)':'var(--papier)',stroke:dark?'var(--papier)':'var(--atrament)','stroke-width':2,rx:2,'stroke-dasharray':dark?'5 4':'none'}));
  const ink= dark ? 'var(--papier)' : 'var(--atrament)';
  s.appendChild(h('text',{x:10,y:66,'font-size':14.5,'font-weight':600,fill:ink,'font-family':'Fraunces',style:F},name));
  s.appendChild(h('text',{x:10,y:81,'font-size':11.5,fill:ink,'font-style':'italic'},l3));
  if(st==='buy'){
    const [p,rest]=l2.split(' · ');
    s.appendChild(h('rect',{x:2,y:48,width:6,height:56,fill:'var(--cegla)'}));
    // coin + price
    s.appendChild(h('circle',{cx:17,cy:93,r:6,fill:'none',stroke:'var(--cegla)','stroke-width':2}));
    s.appendChild(h('text',{x:28,y:97.5,'font-size':13,'font-weight':700,fill:'var(--cegla)'},p+' monet'));
    if(rest) s.appendChild(h('text',{x:176,y:97.5,'font-size':11,fill:'var(--atrament)','text-anchor':'end','font-style':'italic'},rest));
  } else {
    s.appendChild(h('text',{x:10,y:97,'font-size':11.5,fill:dark?'var(--sodowa)':'var(--atrament)','font-weight':dark?500:400},l2));
  }
  g.appendChild(s);
}
</script>
</body></html>
