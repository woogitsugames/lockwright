<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Realizm · mikroskop</title>
<link rel="stylesheet" href="../shared/fonts.css"><link rel="stylesheet" href="realizm.css">
</head><body>
<!-- Bench microscope (workshop only, D-13). Cylinder in the vice, plug under the objective, ~2x the loupe.
     Left stack: driver above the shear line, clean dark gap = SET. Right stack: spool waist sitting on the
     shear line = FALSE SET. Drag on the right half slides the stage along the shear line (rail below shows where). -->
<main class="screen">
  <div class="ocular"></div>
  <div class="field mic" role="img" aria-label="Mikroskop: linia podziału przy pinach 1 i 2. Pin 1 ustawiony, na pinie 2 talia szpulki na linii podziału."></div>
  <div class="rail" aria-hidden="true"><i class="big"></i><i></i><i></i><i></i><i class="big"></i><i></i><i></i><i></i><i class="big"></i><i></i><i></i><i></i><i class="big"></i><i></i><i></i><i></i><i class="big"></i><b></b></div>
  <button class="pause" aria-label="Odsuń się od mikroskopu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <!-- i18n: hud.optics.microscope.hint · PL „Jedynka siedzi. Dwójka wisi na talii.” · EN "One is set. Two hangs on its waist." -->
  <p class="hint">Jedynka siedzi. Dwójka wisi na talii.</p>
</main>
</body></html>
