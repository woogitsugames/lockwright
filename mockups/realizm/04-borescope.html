<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Realizm · wziernik</title>
<link rel="stylesheet" href="../shared/fonts.css"><link rel="stylesheet" href="realizm.css">
</head><body>
<!-- Borescope (field tool, D-13): the phone shows the handheld's display. Side-looking probe under pin 3, LED ring.
     Key-pin tips read from below: hanging tip = resting, tip inside a dark ring = lifted toward the shear line,
     tip lost deep in the hole = pushed too far (overset). The cable with 5 mm rings is the depth control (drag). -->
<main class="screen">
  <div class="display"></div>
  <div class="field bore" role="img" aria-label="Wziernik: od dołu widać końce pinów. Pin 3 uniesiony haczykiem, pin 4 schowany głęboko w otworze."></div>
  <div class="cable" aria-hidden="true"></div><div class="notch" aria-hidden="true"></div>
  <button class="pause" aria-label="Wyjmij wziernik"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <!-- i18n: hud.optics.borescope.hint · PL „Czwórka uciekła w górę. Za wysoko.” · EN "Four ran up out of sight. Too high." -->
  <p class="hint">Czwórka uciekła w górę. Za wysoko.</p>
</main>
</body></html>
