<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prześwit · zamek</title>
<link rel="stylesheet" href="../shared/fonts.css"><link rel="stylesheet" href="przeswit.css">
<style>
  .vign{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
  .vign .tapes{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
  .vign svg{width:132px;height:52px}
  .t-soft{fill:var(--soft)}
</style>
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- MATERIAL CODE: perforation inside the card lets the lamp through; hue is only a bonus -->
    <!-- iron: dense round perforation -->
    <pattern id="ironP" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="var(--ink)"/><circle cx="3" cy="3" r="1.7" fill="var(--light)"/><circle cx="9" cy="9" r="1.7" fill="var(--light)"/></pattern>
    <!-- steel: diamond perforation -->
    <pattern id="steelP" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="var(--steel)"/><path d="M5 2.4L7.6 5L5 7.6L2.4 5Z" fill="var(--light)"/></pattern>
    <!-- brass: smooth card, short parallel cuts -->
    <pattern id="brassP" width="14" height="7" patternUnits="userSpaceOnUse"><rect width="14" height="7" fill="var(--brass)"/><rect x="2" y="3" width="8" height="1.2" fill="var(--light)"/><rect x="9" y="6.5" width="4" height=".5" fill="var(--brass)"/></pattern>
    <!-- wood: layered card, grain cut as long wavy slits -->
    <pattern id="woodP" width="48" height="12" patternUnits="userSpaceOnUse"><rect width="48" height="12" fill="var(--wood)"/><path d="M0 4C12 2 22 7 34 4S44 3 48 4" fill="none" stroke="var(--light)" stroke-width="1.1"/><path d="M6 10C14 9 20 11 30 10" fill="none" stroke="var(--light)" stroke-width=".8"/></pattern>
    <!-- iron edge: torn / forged, used only far from the shear line -->
    <filter id="ragged" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".11" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
  </defs>
</svg>

<main class="screen lock">
  <header class="bar">
    <button class="tap" aria-label="Pauza"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="var(--light)"/><rect x="14" y="4" width="4" height="16" fill="var(--light)"/></svg></button>
    <div class="bar-title"><span class="kicker">Tryb Ciągły · seria 3</span><span class="h">Zamek siódmy</span></div>
    <div class="coins" aria-label="Monety 142"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" fill="var(--ink)"/><rect x="9.5" y="9.5" width="7" height="7" fill="var(--light)"/><path d="M13 2.5v3M13 20.5v3M2.5 13h3M20.5 13h3" stroke="var(--light)" stroke-width="1.2"/></svg><span>142</span></div>
  </header>

  <section class="vign" aria-label="Zlecenie">
    <div class="tapes"><span class="tape">Pani Halina · III piętro</span><span class="tape it">rosół: bulgocze</span></div>
    <svg viewBox="0 0 132 52" aria-hidden="true">
      <!-- pot with steam (cut card), door with a line of light under it -->
      <g fill="var(--ink)"><path d="M8 34h34v4c0 6-5 10-11 10H19c-6 0-11-4-11-10z"/><rect x="4" y="31" width="42" height="4"/><rect x="21" y="27" width="8" height="4"/></g>
      <path d="M17 24c-4-4 4-6 0-11M25 24c-4-4 4-6 0-11M33 24c-4-4 4-6 0-11" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
      <rect x="72" y="0" width="56" height="48" fill="var(--ink)"/>
      <rect x="80" y="4" width="40" height="44" fill="url(#woodP)"/>
      <rect x="80" y="45" width="40" height="3" fill="var(--light)"/>
      <rect x="110" y="24" width="6" height="10" fill="var(--light)"/>
      <rect x="93" y="12" width="14" height="9" fill="var(--light)"/><text x="100" y="19.6" text-anchor="middle" class="st" font-size="9" font-weight="800" fill="var(--ink)">12</text>
    </svg>
  </section>

  <section class="sect" aria-label="Przekrój mechanizmu">
    <svg id="sect" viewBox="0 0 412 340">
      <!-- HOUSING (iron): torn edge + dense perforation -->
      <g filter="url(#ragged)"><rect x="22" y="8" width="368" height="200" fill="var(--ink)"/></g>
      <rect x="30" y="16" width="352" height="166" fill="url(#ironP)"/>
      <rect x="20" y="186" width="372" height="14" fill="var(--ink)"/><!-- clean zone at shear line -->
      <!-- PLUG (brass): smooth edge, fine parallel cuts -->
      <rect x="20" y="204" width="368" height="114" rx="2" fill="url(#brassP)"/>
      <rect x="20" y="204" width="368" height="12" fill="var(--brass)"/><!-- clean zone -->
      <!-- scuffs: a few hand-placed abrasion marks, not a filter -->
      <path d="M300 300l40-3M318 306l22-1.5M60 26l30 4M330 30l18 6" stroke="var(--light)" stroke-width=".9" opacity=".55"/>
      <!-- SHEAR LINE: a continuous slit of lamp light, 4 dp -->
      <rect x="0" y="200" width="412" height="4" fill="var(--light)"/>
      <!-- keyway -->
      <rect x="20" y="270" width="352" height="22" fill="var(--light)"/>
      <g id="chambers" fill="var(--light)"></g>
      <g id="marks" fill="var(--light)"></g>
      <g id="pins"></g>
      <g id="hand"></g>
      <g class="st" font-size="15" font-weight="700" fill="var(--soft)" text-anchor="middle" id="letters"></g>
    </svg>
  </section>

  <section class="hud" aria-label="HUD w świecie">
    <svg id="hud" viewBox="0 0 412 108"></svg>
  </section>

  <section class="thumbs">
    <div class="zone left" aria-label="Napięcie: lewy kciuk">
      <svg id="zl" viewBox="0 0 150 290" preserveAspectRatio="xMidYMid meet"></svg>
      <span class="zlabel">napięcie</span>
    </div>
    <div class="zone right" aria-label="Wytrych: prawy kciuk">
      <svg id="zr" viewBox="0 0 220 290" preserveAspectRatio="xMidYMid meet"></svg>
      <span class="zlabel">wytrych</span>
    </div>
  </section>
</main>

<script>
// ---- geometry helpers (mockup only) ----
const $ = id => document.getElementById(id);
const C = [74, 140, 206, 272, 338];            // chamber centres, pitch 66 dp
const S0 = 200, S1 = 204;                     // shear slit
const spring = (cx, y0, y1, n = 9) => {        // zigzag wire; light shows between coils
  let d = `M${cx - 11} ${y0}`; const st = (y1 - y0) / n;
  for (let i = 0; i < n; i++) d += `L${cx + (i % 2 ? -11 : 11)} ${y0 + st * (i + .5)}`;
  d += `L${cx - 11} ${y1}`;
  return `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/><rect x="${cx-13}" y="${y1-3}" width="26" height="3" fill="var(--ink)"/>`;
};
const solidSpring = (cx, y0, y1) => `<rect x="${cx-15}" y="${y0}" width="30" height="${y1-y0}" fill="var(--ink)"/>` +
  Array.from({length: Math.floor((y1 - y0) / 4)}, (_, i) => `<path d="M${cx-15} ${y0+2+i*4}h30" stroke="#3a342c" stroke-width="1"/>`).join('');
const driver = (cx, t, L = 46, extra = '') =>
  `<path d="M${cx-15} ${t}H${cx+15}V${t+L-3}L${cx+12} ${t+L}H${cx-12}L${cx-15} ${t+L-3}Z" fill="url(#steelP)" ${extra}/>`;
const keyPin = (cx, t, L = 58, extra = '') =>
  `<path d="M${cx-12} ${t}H${cx+12}L${cx+15} ${t+3}V${t+L-14}Q${cx+15} ${t+L-6} ${cx+5} ${t+L}H${cx-5}Q${cx-15} ${t+L-6} ${cx-15} ${t+L-14}V${t+3}Z" fill="url(#brassP)" ${extra}/>`;
const spool = (cx, t, L = 48) => {
  const p = `M${cx-15} ${t}H${cx+15}V${t+10}Q${cx+6} ${t+14} ${cx+6} ${t+20}V${t+L-20}Q${cx+6} ${t+L-14} ${cx+15} ${t+L-10}V${t+L-3}L${cx+12} ${t+L}H${cx-12}L${cx-15} ${t+L-3}V${t+L-10}Q${cx-6} ${t+L-14} ${cx-6} ${t+L-20}V${t+20}Q${cx-6} ${t+14} ${cx-15} ${t+10}Z`;
  return `<path d="${p}" fill="url(#steelP)"/><path d="${p}" fill="none" stroke="var(--light)" stroke-width="1.6" stroke-dasharray="3.5 2.5"/>`;
};
const shadow = (cx, t, L) => `<rect x="${cx-15}" y="${t+3}" width="30" height="${L}" fill="var(--shade)"/>`;

// chambers (holes in the card = light)
$('chambers').innerHTML = C.map(c => `<rect x="${c-19}" y="64" width="38" height="136"/><rect x="${c-19}" y="204" width="38" height="66"/>`).join('');

// ---- pin stacks ----
let P = '';
// a: SET. split on the slit -> slit runs straight through the chamber; driver gets a flat foot
P += spring(C[0], 64, 154) + shadow(C[0],154,46) + driver(C[0], 154) + `<rect x="${C[0]-18}" y="194" width="36" height="6" fill="var(--ink)"/>` + shadow(C[0],216,56) + keyPin(C[0], 216, 56);
// b: FALSE SET. spool waist caught in the slit -> an "eye" of light around the waist; perforated (dashed) edge
P += spring(C[1], 64, 178) + spool(C[1], 178) + shadow(C[1],226,46) + keyPin(C[1], 226, 46);
// c: BINDING + NEAR SHEAR. driver pressed 3 dp to the right, tilted -> light wedge on the left
P += spring(C[2], 64, 150) + `<g transform="translate(3 0) rotate(-1.6 ${C[2]+15} 196)">${driver(C[2], 150)}</g>` + keyPin(C[2], 196);
// d: OVERSET. key pin straddles the slit, spring is a solid block (no light between coils), clamp above
P += solidSpring(C[3], 64, 106) + driver(C[3], 106) + keyPin(C[3], 152);
// e: FREE. centred, even light margins, straight cast shadow
P += spring(C[4], 64, 168) + shadow(C[4],168,46) + driver(C[4], 168) + shadow(C[4],214,58) + keyPin(C[4], 214);
$('pins').innerHTML = P;

// sign vocabulary cut into the card (light): friction ticks, near-shear wedge, clamp
$('marks').innerHTML =
  // c: 2 friction ticks on the pressed side (3rd disappears in near_shear)
  `<path d="M227 178l9-6v3.4l-9 6zM227 187l9-6v3.4l-9 6z"/>` +
  // c: near-shear wedge = two triangles pointing at each other across the slit
  `<path d="M175 186h10l-5 9z"/><path d="M175 218h10l-5 -9z"/>` +
  // d: clamp (two horizontal bars) above the overset chamber
  `<rect x="${C[3]-19}" y="42" width="38" height="5"/><rect x="${C[3]-19}" y="52" width="38" height="5"/>` +
  // b: "too far" notch on the housing above the slit
  ``;

// ---- player's hand (minium card): tension wrench + hook pick under pin c ----
const tw = `<path d="M44 288.5H14L2 338" fill="none" stroke="var(--tool)" stroke-width="7" stroke-linejoin="miter"/>`;
const twScale = Array.from({length: 6}, (_, i) => { const a = (100 + i * 9) * Math.PI / 180, r0 = 40, r1 = 47;
  return `<path d="M${14+Math.cos(a)*r0} ${289+Math.sin(a)*r0}L${14+Math.cos(a)*r1} ${289+Math.sin(a)*r1}" stroke="var(--ink)" stroke-width="${i===2?3:1.6}"/>`; }).join('');
// pick: bowed shank (stress bend), light hairline cracks across the bend, burrs on the tip, wear notches
const pick = `<path d="M-6 280H130C160 280 182 277 194 268L203 258" fill="none" stroke="var(--tool)" stroke-width="7" stroke-linecap="round"/>
  <path d="M197 262l5-10l3 1l1-3l3 2l-1 4l2 3l-6 6z" fill="var(--tool)"/>
  <path d="M168 273l3 8M178 269l3 7.5" stroke="var(--light)" stroke-width="1.4"/>
  <path d="M56 276.5l3 3l3-3M84 276.5l3 3l3-3" fill="var(--light)"/>`;
$('hand').innerHTML = twScale + tw + pick;

$('letters').innerHTML = ['a','b','c','d','e'].map((l, i) => `<text x="${C[i]}" y="336">${l}</text>`).join('');

// ---- HUD in the world ----
const tick = (a, r0, r1, w) => `<rect x="${-w/2}" y="${-r1}" width="${w}" height="${r1-r0}" transform="rotate(${a})"/>`;
const pickSil = (x, y, k = 1) => `M${x} ${y}h${34*k}M${x+34*k} ${y}h${62*k}l${6*k} ${-6*k}`;
$('hud').innerHTML = `
  <g transform="translate(58 56)">
    <circle r="49" fill="var(--ink)"/>
    <g fill="var(--light)">${[0,12,24,36,48,60,-12,-24].map(a => a===24 ? tick(a, 30, 50, 4) : tick(a, 40, 50, 3)).join('')}</g>
    <g transform="rotate(24)"><circle r="33" fill="url(#brassP)"/><rect x="-4.5" y="-23" width="9" height="36" rx="1" fill="var(--light)"/><path d="M0-33l-5 8h10z" fill="var(--light)"/></g>
    <path d="M14 47L-14 47" stroke="var(--tool)" stroke-width="0"/>
  </g>
  <g transform="translate(118 10)">
    <path d="M0 3L6 0L14 4L22 0H148L145 14L148 28L144 50H0L3 30L0 16Z" fill="var(--shade)"/>
    <text x="10" y="20" font-family="Lato" font-weight="700" font-size="14" fill="var(--ink)">Szpulka.</text>
    <text x="10" y="38" font-family="Lato" font-size="13" fill="var(--ink)">Popuść i daj jej wrócić.</text>
  </g>
  <g transform="translate(118 72)">
    ${['a','b','c','d','e'].map((l,i)=> i===0
      ? `<rect x="${i*24}" y="0" width="20" height="26" fill="var(--ink)"/><rect x="${i*24+3}" y="3" width="14" height="20" fill="var(--light)"/><text x="${i*24+10}" y="17" text-anchor="middle" class="st" font-size="14" font-weight="800" fill="var(--ink)">${l}</text><rect x="${i*24+4}" y="19" width="12" height="2.5" fill="var(--ink)"/>`
      : `<rect x="${i*24}" y="0" width="20" height="26" fill="var(--ink)"/><text x="${i*24+10}" y="18" text-anchor="middle" class="st" font-size="14" font-weight="800" fill="var(--light)">${l}</text>`).join('')}
    <text x="122" y="19" class="st" font-size="17" font-weight="800" fill="var(--ink)">1/5</text>
  </g>
  <g transform="translate(272 6)">
    <path d="M0 2L3 0H134V96H3L0 94Z" fill="var(--ink)"/>
    <text x="10" y="17" font-family="Lato" font-weight="700" font-size="10.5" letter-spacing="1.2" fill="var(--light)">ZAPAS 2/3</text>
    <g fill="none" stroke-linecap="round">
      <path d="${pickSil(12,36)}" stroke="var(--light)" stroke-width="12"/><path d="${pickSil(12,36)}" stroke="var(--tool)" stroke-width="7"/>
      <path d="${pickSil(12,60)}" stroke="var(--light)" stroke-width="12"/><path d="${pickSil(12,60)}" stroke="var(--tool)" stroke-width="7"/>
      <path d="M100 56l3-3l2 3l3-3" stroke="var(--light)" stroke-width="1.6"/>
      <path d="${pickSil(12,84)}" stroke="var(--light)" stroke-width="12"/>
    </g>
    <path d="M14 36h30M14 60h30" stroke="var(--light)" stroke-width="1.3" stroke-dasharray="2 4"/>
  </g>`;

// ---- left thumb: tension = the wrench handle sliding in a cut track ----
const ticksL = Array.from({length: 11}, (_, i) => `<rect x="36" y="${36 + i*22}" width="${i%5===0?16:10}" height="2.4"/>`).join('');
const teeth = Array.from({length: 6}, (_, i) => `<path d="M68 ${34+i*10}l-5 5l5 5zM82 ${34+i*10}l5 5l-5 5z"/>`).join('');
$('zl').innerHTML = `
  <path d="M28 6H122V284H28Z" fill="var(--ink)"/>
  <rect x="68" y="30" width="14" height="230" rx="2" fill="var(--light)"/>
  <g fill="var(--light)">${ticksL}${teeth}</g>
  <text x="102" y="28" text-anchor="middle" font-family="Lato" font-weight="700" font-size="11" fill="var(--light)">mocno</text>
  <text x="102" y="276" text-anchor="middle" font-family="Lato" font-weight="700" font-size="11" fill="var(--light)">luźno</text>
  <g transform="translate(75 156)">
    <path d="M-34 -28H34V28H-34Z" fill="var(--tool)"/>
    <g fill="var(--light)"><rect x="-22" y="-12" width="44" height="3"/><rect x="-22" y="-1.5" width="44" height="3"/><rect x="-22" y="9" width="44" height="3"/></g>
    <path d="M-34 0h-8" stroke="var(--tool)" stroke-width="0"/>
  </g>
  <path d="M30 150l8 6l-8 6z" fill="var(--light)"/>`;

// ---- right thumb: 2D pick pad (depth = across, lift = up) ----
const rulerB = Array.from({length: 9}, (_, i) => `<rect x="${22 + i*22}" y="252" width="2.4" height="${i%4===0?12:7}"/>`).join('');
const rulerL = Array.from({length: 11}, (_, i) => `<rect x="6" y="${24 + i*22.4}" width="${i%5===0?12:7}" height="2.4"/>`).join('');
const dots = []; for (let x = 44; x < 198; x += 22) for (let y = 46; y < 248; y += 22) dots.push(`<circle cx="${x}" cy="${y}" r="1.3"/>`);
$('zr').innerHTML = `
  <path d="M2 6H218V284H2Z" fill="var(--ink)"/>
  <rect x="22" y="24" width="176" height="224" fill="var(--light)"/>
  <g fill="var(--shade)">${dots.join('')}</g>
  <g fill="var(--light)">${rulerB}${rulerL}</g>
  <text x="196" y="278" text-anchor="end" font-family="Lato" font-weight="700" font-size="11" fill="var(--light)">głębiej →</text>
  <text x="24" y="18" font-family="Lato" font-weight="700" font-size="11" fill="var(--light)">↑ unieś</text>
  <g font-family="Big Shoulders Stencil" font-weight="800" font-size="13" text-anchor="middle" fill="var(--soft)">
    ${['a','b','c','d','e'].map((l,i)=>`<text x="${50+i*30}" y="42">${l}</text>`).join('')}
  </g>
  <path d="M104 46l6 8l6-8z" fill="var(--ink)"/>
  <path d="M22 170H96C112 170 120 166 126 158" fill="none" stroke="var(--tool)" stroke-width="7" stroke-linecap="round"/>
  <rect x="40" y="163" width="56" height="14" fill="var(--tool)"/>
  <g transform="translate(110 118)">
    <circle r="31" fill="none" stroke="var(--tool)" stroke-width="7"/>
    <circle r="31" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="2 3"/>
    <rect x="-3" y="-3" width="6" height="6" fill="var(--tool)"/>
  </g>`;

// landscape: crop the section to the working part, so pins stay >= 28 dp
if (matchMedia('(orientation: landscape)').matches) $('sect').setAttribute('viewBox', '0 36 412 286');
</script>
</body></html>
