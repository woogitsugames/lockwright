<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klatka · zamek</title>
<link rel="stylesheet" href="../shared/fonts.css"><link rel="stylesheet" href="klatka.css">
<script>window.__ready = false;</script>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script>
</head><body>
<main class="screen lock">
  <header class="bar">
    <button class="tap switch" aria-label="Pauza"><span class="switch-face"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></span></button>
    <div class="plate-enamel"><span class="no">14</span><span class="who">Pani Halina<small>rosół na gazie · III p.</small></span></div>
    <div class="coins"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>142</div>
  </header>
  <div class="stage">
    <canvas id="c"></canvas>
    <svg id="chalk" class="chalk"></svg>
  </div>
  <section class="thumbs">
    <div class="zone left" aria-label="Napięcie">
      <div class="slot"><div class="knob" style="top:38%"></div><div class="ticks"></div></div>
      <span class="zlabel">napięcie</span>
    </div>
    <div class="zone right" aria-label="Wytrych">
      <div class="pad"><div class="thumb" style="left:58%;top:42%"></div></div>
      <span class="zlabel">wytrych</span>
    </div>
  </section>
</main>
<script type="module">
import { THREE, Y, materials, spring, driverPin, keyPin, lathe, flatPath, makeRenderer, stairwellLights, orthoCamera, projector } from './scene.js';
import { RoundedBoxGeometry } from '../node_modules/three/examples/jsm/geometries/RoundedBoxGeometry.js';

const stage = document.querySelector('.stage');
const W = stage.clientWidth, H = stage.clientHeight;
const canvas = document.getElementById('c');
const R = makeRenderer(canvas, W, H);
const S = new THREE.Scene();
const M = materials();

// layout window: x 0..412, y 14..(14+412*H/W)
let yTop = 14, yBot = yTop + 412 * H / W, x0 = 0, x1 = 412;
if (yBot < 372) { yTop = 14; yBot = 372; const half = (yBot - yTop) * W / H / 2; x0 = 206 - half; x1 = 206 + half; } // landscape: fit section height
const cam = orthoCamera(x0, x1, yTop, yBot);
stairwellLights(S, undefined, R);

const add = (g, m, cast = true) => { const o = new THREE.Mesh(g, m); o.castShadow = cast; o.receiveShadow = true; S.add(o); return o; };
const box = (x0, y0, x1, y1, z0, z1, m, r = 1.2) => { const g = new RoundedBoxGeometry(x1 - x0, y1 - y0, z1 - z0, 2, r); g.translate((x0 + x1) / 2, Y((y0 + y1) / 2), (z0 + z1) / 2); return add(g, m); };

// door leaf (wood) and recess behind the cut
box(-300, -40, 712, 362, -46, -34, M.wood, 2);
box(28, 40, 384, 334, -34, -30, M.recess, 0.5);

// housing (steel): top bar + columns between chambers; chamber x: 79,135,191,247,303 (w34)
const cx = [79, 135, 191, 247, 303];
box(28, 40, 384, 52, -30, 0, M.steel);
const edges = [28, ...cx.flatMap(x => [x, x + 34]), 384];
for (let i = 0; i < edges.length; i += 2) box(edges[i], 52, edges[i + 1], 232, -30, 0, M.steel);
// plug (brass), rotated under tension => drawn +5; keyway is the open band 300..328
const pe = [28, ...cx.flatMap(x => [x + 5, x + 39]), 384];
for (let i = 0; i < pe.length; i += 2) box(pe[i], 236, pe[i + 1], 300, -30, 0, M.brass);
box(28, 328, 384, 334, -30, 0, M.brass); box(372, 300, 384, 328, -30, 0, M.brass);

// springs
add(spring(96, 52, 184, 13), M.spring); add(spring(152, 52, 192, 17), M.spring); add(spring(208, 52, 196, 12), M.spring);
add(spring(264, 52, 148, 29, 11, 1.65), M.spring); add(spring(320, 52, 210, 11), M.spring);
// a: SET — driver sits on plug top (ledge), key pin dropped
add(driverPin(96, 184), M.driver); add(keyPin(101, 252, 48), M.brass);
// b: FALSE SET — spool driver, waist on the shear line
add(lathe(152, [[0,192],[13,192],[14.5,193.5],[14.5,222],[8,230],[8,242],[14.5,250],[14.5,258.5],[13,260],[0,260]]), M.driver); add(keyPin(157, 262, 38), M.brass);
// c: BINDING — driver pressed +2 against the wall, key pin lifted near shear
add(driverPin(210, 196), M.driver); add(keyPin(213, 244, 52), M.brass);
// d: OVERSET — key pin straddles the shear line
add(driverPin(264, 148), M.driver); add(keyPin(264, 194, 62), M.brass);
// e: FREE
add(driverPin(320, 210), M.driver); add(keyPin(325, 256, 44), M.brass);

// pick (bright spring steel) bent under stress, hook under key pin c
add(flatPath([[-30, 317], [60, 319], [130, 316], [175, 311], [196, 305], [207, 299], [211, 297]], 5.5, 2.4), M.pick);
// tension wrench at the keyway mouth
add(flatPath([[44, 326], [20, 326], [12, 332], [10, 360]], 6, 2.4), M.pick);

// --- door face strip: iron escutcheon + cylinder face with engraved scale; leather roll with spare picks
box(-20, 362, 432, 620, -46, -36, M.wood, 2);
const esc = new RoundedBoxGeometry(110, 170, 6, 3, 3); esc.translate(96, Y(470), -33); add(esc, M.iron);
const ring = new THREE.CylinderGeometry(50, 50, 8, 64); ring.rotateX(Math.PI / 2); ring.translate(96, Y(450), -26); add(ring, M.steel);
const face = new THREE.CylinderGeometry(36, 36, 9, 64); face.rotateX(Math.PI / 2); face.translate(96, Y(450), -25.4); add(face, M.brass);
// engraved ticks on the ring: 0..5, deep cut = false-set depth
for (let i = 0; i <= 5; i++) { const g = new THREE.BoxGeometry(i === 2 ? 4 : 2.4, i === 2 ? 12 : 8, 2); g.translate(0, 45, 0); g.rotateZ(-i * 12 * Math.PI / 180); g.translate(96, Y(450), -21.6); add(g, M.recess, false); }
// keyway slot rotated two ticks
const slot = new THREE.BoxGeometry(8, 42, 2); slot.translate(0, 4, 0); slot.rotateZ(-24 * Math.PI / 180); slot.translate(96, Y(450), -20.6); add(slot, M.recess, false);
// wrench seen from the front
const wr = flatPath([[96 + 10, 462], [60, 496], [40, 506]], 7, 3); wr.translate(0, 0, -6); add(wr, M.pick);
// leather roll with three slots; slot 3 empty (imprint only)
box(212, 380, 404, 560, -36, -31, M.leather, 4);
for (let i = 0; i < 3; i++) {
  const y = 414 + i * 46;
  box(222, y - 9, 394, y + 9, -31, -30, M.recess, 3); // slot imprint
  if (i < 2) {
    const blade = flatPath([[268, y], [360, y], [374, y - 3], [380, y - 10]], 4.5, 2.2); blade.translate(0, 0, -20); add(blade, M.pick);
    box(226, y - 7, 270, y + 7, -30, -24, M.handle, 3);
    if (i === 1) { for (let k = 0; k < 3; k++) { const b = new THREE.BoxGeometry(1.6, 4, 1); b.translate(372 + k * 3, Y(y - 6 - k * 2), -18); add(b, M.recess, false); } }
  }
}
R.render(S, cam);

// ---------- chalk overlay: the locksmith's marks (state code, readable without colour) ----------
const P = projector(cam, W, H);
const chalk = document.getElementById('chalk'); chalk.setAttribute('viewBox', `0 0 ${W} ${H}`);
const pl = pts => pts.map(p => P(...p)).map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
const line = (a, b, cls = '') => `<polyline class="${cls}" points="${pl([a, b])}"/>`;
let s = `<defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs><g filter="url(#rough)">`;
// c: friction ticks at the contact wall + near-shear wedge
for (let k = 0; k < 3; k++) s += line([229, 226 + k * 7], [238, 219 + k * 7]);
s += `<polygon class="fill" points="${pl([[186, 228], [177, 223], [177, 233]])}"/><polygon class="fill" points="${pl([[186, 246], [177, 241], [177, 251]])}"/>`;
// d: clamp over chamber
s += line([247, 31], [281, 31], 'thick') + line([247, 36], [281, 36], 'thick');
// b: dashed outline around the spool
s += `<polyline class="dash" points="${pl([[134, 189], [170, 189], [170, 263], [134, 263], [134, 189]])}"/>`;
// a: foot (set) underline
s += line([80, 238], [112, 238], 'thick');
// stress scratches across the pick bend
s += line([150, 309], [153, 322]) + line([160, 307], [163, 320]);
// letters
['a', 'b', 'c', 'd', 'e'].forEach((t, i) => { const [x, y] = P(96 + i * 56, 352); s += `<text x="${x}" y="${y}">${t}</text>`; });
// plug face: "za głęboko" note
{ const [x, y] = P(150, 432); s += `<text class="note" x="${x}" y="${y}">za głęboko —</text><text class="note" x="${x}" y="${y + 17}">popuść</text>`; }
s += `</g>`;
chalk.innerHTML = s;
window.__ready = true;
</script>
</body></html>
