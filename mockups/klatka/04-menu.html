<script type="module">
import { THREE, materials, makeRenderer, stairwellLights, buildStairwell } from './scene.js';
import { RoundedBoxGeometry } from 'three/examples/jsm/geometries/RoundedBoxGeometry.js';
const c = document.getElementById('c'); const W = innerWidth, H = innerHeight;
const R = makeRenderer(c, W, H); const S = new THREE.Scene(); S.background = new THREE.Color(0x1a1816);
const M = materials();
buildStairwell(S, M, { doorNo: '14' });
// locksmith's bag on the landing
const bag = new THREE.Mesh(new RoundedBoxGeometry(90, 50, 40, 4, 8), new THREE.MeshStandardMaterial({ map: M.leather.map, roughness: 0.85 })); bag.position.set(150, -124, 90); bag.rotation.y = -0.4; bag.castShadow = true; S.add(bag);
const strap = new THREE.Mesh(new THREE.TorusGeometry(26, 2.5, 8, 32, Math.PI), M.iron); strap.position.set(150, -99, 90); strap.rotation.y = -0.4; S.add(strap);
// lights: bare bulb above the door (warm), no bloom
S.environment = new THREE.PMREMGenerator(R).fromScene(new (await import('three/examples/jsm/environments/RoomEnvironment.js')).RoomEnvironment(), 0.04).texture; S.environmentIntensity = 0.35;

const bulb = new THREE.SpotLight(0xffcf96, 4e5, 0, Math.PI / 3.2, 0.75, 2); bulb.position.set(-60, 420, 260); bulb.target.position.set(0, 0, 0); bulb.castShadow = true; bulb.shadow.mapSize.set(2048, 2048); S.add(bulb, bulb.target);
const fill = new THREE.DirectionalLight(0x9fb3cc, 0.25); fill.position.set(500, 200, 400); S.add(fill);
const portrait = H > W;
const cam = new THREE.PerspectiveCamera(portrait ? 43 : 34, W / H, 1, 4000);
if (portrait) { cam.position.set(30, 110, 1180); cam.lookAt(10, 80, 0); } else { cam.position.set(330, 90, 1000); cam.lookAt(330, 70, 0); }
R.render(S, cam);
window.__ready = true;
</script>
