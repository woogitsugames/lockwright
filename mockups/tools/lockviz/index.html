<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lockviz — lockcore replay debugger</title>
<style>
  @font-face { font-family: 'Atkinson'; src: url('../../fonts/AtkinsonHyperlegibleNext-wght.ttf') format('truetype'); font-weight: 200 800; }
  :root {
    --paper: #efebe2; --panel: #f8f6f1; --ink: #23211d; --muted: #6b665c; --rule: #bdb6a7;
    --metal: #4a4f55; --accent: #a4472a; --blue: #2f5d7c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font: 13px/1.35 'Atkinson', sans-serif; }
  body { display: grid; grid-template-rows: auto auto auto; min-height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px;
    border-bottom: 2px solid var(--rule); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 6px 0 0; letter-spacing: .02em; }
  header .meta { color: var(--muted); }
  select, button, input[type=file] { font: inherit; }
  button, select { min-height: 32px; padding: 2px 10px; border: 1.5px solid var(--ink); background: var(--panel);
    color: var(--ink); border-radius: 3px; cursor: pointer; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }
  label.file { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(420px, 1fr) 340px; height: 560px; }
  #schematicWrap { position: relative; min-height: 0; border-right: 2px solid var(--rule); }
  #schematic { position: absolute; inset: 0; width: 100%; height: 100%; }
  aside { overflow: auto; padding: 10px 14px; background: var(--panel); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 4px; }
  aside h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td { padding: 1px 4px; border-bottom: 1px solid #e2ddd2; }
  td.k { color: var(--muted); }
  #events li { font-variant-numeric: tabular-nums; }
  #events { list-style: none; padding: 0; margin: 0; }
  #events li.now { font-weight: 700; }
  #events li .t { color: var(--muted); display: inline-block; width: 52px; }
  footer { border-top: 2px solid var(--rule); background: var(--panel); }
  #controls { display: flex; gap: 8px; align-items: center; padding: 6px 14px; flex-wrap: wrap; }
  #controls .time { font-variant-numeric: tabular-nums; min-width: 230px; }
  #scrub { flex: 1; min-width: 200px; accent-color: var(--ink); }
  #timeline { display: block; width: 100%; height: 420px; cursor: crosshair; }
  .warn { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>lockviz</h1>
  <select id="pick" aria-label="Golden replay"></select>
  <label class="file">trace <input type="file" id="fileTrace" accept=".json"></label>
  <label class="file">replay <input type="file" id="fileReplay" accept=".json"></label>
  <span class="meta" id="meta"></span>
</header>
<main>
  <div id="schematicWrap"><canvas id="schematic"></canvas></div>
  <aside>
    <h2>Frame</h2>
    <table id="frameTable"></table>
    <h2>Elements</h2>
    <table id="elemTable"></table>
    <h2>Events up to now (last 14)</h2>
    <ul id="events"></ul>
    <h2>Replay</h2>
    <table id="replayTable"></table>
  </aside>
</main>
<footer>
  <div id="controls">
    <button id="play" aria-label="Play or pause">play</button>
    <button id="prevEv" title="previous event ([)">&lt; ev</button>
    <button id="back" title="step back (left arrow)">-1</button>
    <button id="fwd" title="step forward (right arrow)">+1</button>
    <button id="nextEv" title="next event (])">ev &gt;</button>
    <select id="speed" aria-label="Speed"><option value="0.25">0.25×</option><option value="1" selected>1×</option><option value="4">4×</option><option value="16">16×</option></select>
    <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Scrub frame">
    <span class="time" id="time"></span>
  </div>
  <canvas id="timeline"></canvas>
</footer>
<script src="lockviz.js"></script>
</body>
</html>
