export_path="build/lockwright-debug.pck"

[preset.3]
; D-62: data-only voice pack for an on-demand language (tools/build_voice_packs.py).
; "resources" with no selected files + include_filter = only this language's lines;
; exclude_filter keeps autoload scripts out (the build tool rejects any code in the pck).
; Another language: copy this preset as "Voice <lang>" with its own lines folder.
name="Voice de"
platform="Linux"
runnable=false
export_filter="resources"
export_files=PackedStringArray()
include_filter="assets/audio/lines/de/*.ogg"
exclude_filter="*.gd,*.gdshader,*.gdshaderinc,*.svg,*.gdextension"
export_path="build/voice/voice_de.pck"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.3.options]

binary_format/embed_pck=false

