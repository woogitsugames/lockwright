plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.woogitsugames.lockwright.hapticsprobe'
    compileSdk 36
    defaultConfig { minSdk 30; targetSdk 36 }
    sourceSets {
        // HapticCore.kt is shared with the native control app (same effect code on both sides).
        main.java.srcDirs += '../../shared-android'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.2.stable'
}
