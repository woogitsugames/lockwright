# XcodeGen spec (brew install xcodegen && xcodegen generate) -> LWHapticsNative.xcodeproj
name: LWHapticsNative
options:
  bundleIdPrefix: com.woogitsugames.lockwright.spike
  deploymentTarget:
    iOS: "18.0"
targets:
  LWHapticsNative:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woogitsugames.lockwright.spike.hapticsnative
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: LW Haptics Native
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGNING_ALLOWED: NO
