plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.woogitsugames.lockwright.measure'
    compileSdk 36
    ndkVersion '29.0.14206865'
    defaultConfig {
        minSdk 30
        targetSdk 36
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    sourceSets {
        // Same vibration code as the spike 1-2 probes (HapticCore.kt).
        main.java.srcDirs += '../../../../haptics-latency/shared-android'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.2.stable'
}
