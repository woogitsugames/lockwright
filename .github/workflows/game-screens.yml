name: game-screens

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/game-screens.yml'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xvfb + Mesa llvmpipe
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri
      - name: Install Godot 4.7.2 + templates
        run: |
          mkdir -p /tmp/godot
          curl -sL -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot && chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -sL -o /tmp/godot/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/godot/templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates
      - name: Build lockcore_gd (linux)
        run: |
          pip install scons
          git clone --depth 1 https://github.com/godotengine/godot-cpp.git /tmp/godot-cpp
          cd /tmp/godot-cpp && scons platform=linux target=template_debug arch=x86_64 custom_api_file=gdextension/extension_api-4-7.json -j8
          cd $GITHUB_WORKSPACE/game/addons/lockcore_gd
          GODOT_CPP=/tmp/godot-cpp scons platform=linux target=template_debug arch=x86_64 custom_api_file=/tmp/godot-cpp/gdextension/extension_api-4-7.json -j8
      - name: Render screens 412x915 + 915x412
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --import
          xvfb-run -a -s "-screen 0 1000x1000x24" env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path game --display-driver x11 --rendering-driver opengl3 \
            res://tests/screens.tscn -- --out $GITHUB_WORKSPACE/docs/handoff/screens --size 412x915
          xvfb-run -a -s "-screen 0 1000x1000x24" env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path game --display-driver x11 --rendering-driver opengl3 \
            res://tests/screens.tscn -- --out $GITHUB_WORKSPACE/docs/handoff/screens --size 915x412
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: game-screens
          path: docs/handoff/screens/*.png
