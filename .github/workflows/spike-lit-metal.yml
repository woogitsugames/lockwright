name: spike-lit-metal

# Spike 4 (docs/TECH.md §4): photoreal metal on the Mobile renderer. Debug APK (arm64) for a cheap phone,
# plus a headless (Xvfb + Mesa lavapipe) screenshot as a smoke test that the scene loads and renders.
on:
  push:
    branches: [main]
    paths:
      - 'spikes/lit-metal/**'
      - '.github/workflows/spike-lit-metal.yml'
  workflow_dispatch:

env:
  GODOT: Godot_v4.7.2-stable_linux.x86_64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (platform 36, build-tools 36.1.0)
        run: |
          SDK=$RUNNER_TEMP/android-sdk
          mkdir -p $SDK/cmdline-tools
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $SDK/cmdline-tools && mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
      - name: Godot 4.7.2 + templates + editor settings
        run: |
          mkdir -p /tmp/godot && cd /tmp/godot
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/$GODOT.zip
          unzip -q godot.zip && chmod +x $GODOT
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p $T && unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* $T/
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
      - name: Import + export debug APK
        working-directory: spikes/lit-metal
        run: |
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          /tmp/godot/$GODOT --headless --path . --import
          mkdir -p build
          /tmp/godot/$GODOT --headless --path . --export-debug "Android" build/spike-lit-metal-debug.apk
          ls -la build
      - name: Smoke screenshot (Xvfb + lavapipe, both variants)
        working-directory: spikes/lit-metal
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 > /dev/null
          xvfb-run -s "-screen 0 1400x1800x24" /tmp/godot/$GODOT --path . --rendering-method mobile -- --shot build/ci_a.png --frames 20
          xvfb-run -s "-screen 0 1400x1800x24" /tmp/godot/$GODOT --path . --rendering-method mobile -- --shot build/ci_b.png --frames 20 --variant b
      - uses: actions/upload-artifact@v4
        with:
          name: spike-lit-metal-debug-apk
          path: spikes/lit-metal/build/spike-lit-metal-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spike-lit-metal-ci-screens
          path: spikes/lit-metal/build/ci_*.png
