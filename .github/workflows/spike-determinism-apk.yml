name: spike-determinism-apk
# Session C, stage 3, task 10: lockcore_gd inside a Godot APK (arm64) must produce the same replay hashes as the host.
# Host (Linux x86_64, lockcore_gd .so) records 630 replays (7 families x 3 tiers x 10 seeds x solver/clumsy/partial)
# and their event hashes; the arm64 APK replays them on an Android emulator. GitHub runners are x86_64, so the
# emulator is an x86_64 Android 11+ image that runs arm64-only apps through Google's ARM translation (the arm64
# machine code of lockcore_gd is executed, translated). Native arm64 coverage stays in spike-determinism (qemu, macOS).

on:
  push:
    branches: [main]
    paths:
      - 'lockcore/**'
      - 'game/addons/lockcore_gd/**'
      - 'spikes/determinism/godot/**'
      - 'spikes/determinism/tools/godot_det.sh'
      - '.github/workflows/spike-determinism-apk.yml'
  workflow_dispatch:

env:
  GODOT: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2 + export templates
        run: |
          mkdir -p /tmp/godot && cd /tmp/godot
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip && chmod +x Godot_v4.7.2-stable_linux.x86_64
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p $T && unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* $T/
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME_17_X64" > ~/.config/godot/editor_settings-4.7.tres
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      - name: Cache lockcore_gd (Linux + Android arm64)
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            game/addons/lockcore_gd/bin/liblockcore_gd.linux.template_debug.so
            game/addons/lockcore_gd/bin/liblockcore_gd.android.template_debug.so
          key: lockcore-gd-linux-android-${{ hashFiles('lockcore/include/**', 'lockcore/src/**', 'game/addons/lockcore_gd/src/**', 'game/addons/lockcore_gd/include/**', 'game/addons/lockcore_gd/SConstruct') }}
      - name: Build lockcore_gd (Linux x86_64 + Android arm64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install scons
          git init -q /tmp/godot-cpp && git -C /tmp/godot-cpp fetch -q --depth 1 https://github.com/godotengine/godot-cpp.git e103d348c4b2d8df7b819126d855e19381cb9a87 && git -C /tmp/godot-cpp checkout -q FETCH_HEAD  # pinned (store/legal/DEPENDENCIES.md, N-28)
          API=/tmp/godot-cpp/gdextension/extension_api-4-7.json
          (cd /tmp/godot-cpp && scons platform=linux target=template_debug arch=x86_64 custom_api_file=$API -j8)
          (cd /tmp/godot-cpp && scons platform=android target=template_debug arch=arm64 ndk_version=$NDK_VERSION custom_api_file=$API -j8)
          cd game/addons/lockcore_gd
          GODOT_CPP=/tmp/godot-cpp scons platform=linux target=template_debug arch=x86_64 custom_api_file=$API -j8
          GODOT_CPP=/tmp/godot-cpp scons platform=android target=template_debug arch=arm64 ndk_version=$NDK_VERSION custom_api_file=$API -j8
      - name: Record corpus on host + host self-check
        run: spikes/determinism/tools/godot_det.sh prepare $GODOT /tmp/det 10
      - name: Export arm64 APK
        run: |
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          spikes/determinism/tools/godot_det.sh apk $GODOT /tmp/det
          cp /tmp/det/host_result.txt /tmp/det/build/
      - uses: actions/upload-artifact@v4
        with:
          name: det-apk
          path: |
            /tmp/det/build/lw-determinism.apk
            /tmp/det/build/host_result.txt
          retention-days: 14

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: det-apk
          path: det
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Replay on emulator (x86_64 image, ARM translation)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: spikes/determinism/tools/godot_det.sh device det/lw-determinism.apk det/host_result.txt 900
      - name: Summary
        if: always()
        run: |
          {
            echo "### lockcore_gd w APK arm64 — API ${{ matrix.api }}"
            echo '```'
            cat det/host_result.txt 2>/dev/null | sed 's/^/host   /'
            cat device_result.txt 2>/dev/null | sed 's/^/device /' || echo "device: brak wyniku"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: det-device-api${{ matrix.api }}
          path: |
            device_result.txt
            device_logcat.txt
