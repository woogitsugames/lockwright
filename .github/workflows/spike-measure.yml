name: spike-measure

# Measurement apps for the owner (D-33, spikes/measure/SPEC.md): haptic + audio latency measured with the phone's
# own accelerometer and microphone. One job per platform; artifacts are installable test builds.
on:
  push:
    branches: [main]
    paths:
      - 'spikes/measure/**'
      - '.github/workflows/spike-measure.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen + unsigned build (SwiftUI, Core Haptics, Core Motion, AVAudioEngine)
        working-directory: spikes/measure/ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project LWMeasure.xcodeproj -scheme LWMeasure -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          test -f build/Build/Products/Release-iphoneos/LWMeasure.app/thresholds.json
          cd build/Build/Products/Release-iphoneos && mkdir Payload && cp -R LWMeasure.app Payload/ && zip -qr ../../../../LWMeasure-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: measure-ios-unsigned
          path: spikes/measure/ios/LWMeasure-unsigned.ipa

  android:
    runs-on: ubuntu-latest
    env:
      GODOT: Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (platform 36, build-tools 36.1.0, NDK 29.0.14206865, CMake 3.22.1)
        run: |
          SDK=$RUNNER_TEMP/android-sdk
          mkdir -p $SDK/cmdline-tools
          curl -sL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $SDK/cmdline-tools && mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools" \
            "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
      - name: Gradle 8.11.1
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp && echo "/tmp/gradle-8.11.1/bin" >> $GITHUB_PATH
      - name: Measurement plugin AAR (Kotlin + Oboe click engine)
        working-directory: spikes/measure/android/plugin
        run: |
          gradle --no-daemon :plugin:assembleRelease
          mkdir -p ../app/addons/lockwright_measure/bin
          cp plugin/build/outputs/aar/plugin-release.aar ../app/addons/lockwright_measure/bin/lockwright-measure-release.aar
      - name: Godot 4.7.2 + templates + editor settings
        run: |
          mkdir -p /tmp/godot && cd /tmp/godot
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/$GODOT.zip
          unzip -q godot.zip && chmod +x $GODOT
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p $T && unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* $T/
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
      - name: Export APK (LW Pomiary)
        working-directory: spikes/measure/android/app
        run: |
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          /tmp/godot/$GODOT --headless --path . --import
          T=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p android/build && unzip -qo $T/android_source.zip -d android/build
          cp $T/version.txt android/.build_version && touch android/build/.gdignore
          mkdir -p build
          /tmp/godot/$GODOT --headless --path . --export-debug "Android" build/lw-pomiary.apk
          unzip -l build/lw-pomiary.apk | grep -E "liblwaudio|thresholds"
      - name: Ingest script self-check
        run: python3 spikes/measure/tools/ingest.py spikes/measure/results/*.json --print || true
      - uses: actions/upload-artifact@v4
        with:
          name: measure-android-apk
          path: spikes/measure/android/app/build/lw-pomiary.apk
          retention-days: 90
