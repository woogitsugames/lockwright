name: perf-budget
# Session C, stage 3, task 9: package size and headless startup budgets (docs/handoff/POMIARY.md §8).

on:
  schedule:
    - cron: '41 3 * * *'
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'qa/budget/**'
      - '.github/workflows/perf-budget.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2 + export templates
        run: |
          mkdir -p /tmp/godot
          curl -sL -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot && chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -sL -o /tmp/godot/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/godot/templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates
      - name: Cache lockcore_gd (Linux)
        uses: actions/cache@v4
        with:
          path: game/addons/lockcore_gd/bin/liblockcore_gd.linux.template_debug.so
          key: lockcore-gd-linux-${{ hashFiles('lockcore/include/**', 'lockcore/src/**', 'game/addons/lockcore_gd/src/**', 'game/addons/lockcore_gd/include/**', 'game/addons/lockcore_gd/SConstruct') }}
      - name: Build lockcore_gd (Linux) when missing
        run: |
          if [ ! -f game/addons/lockcore_gd/bin/liblockcore_gd.linux.template_debug.so ]; then
            pip install scons
            git init -q /tmp/godot-cpp && git -C /tmp/godot-cpp fetch -q --depth 1 https://github.com/godotengine/godot-cpp.git e103d348c4b2d8df7b819126d855e19381cb9a87 && git -C /tmp/godot-cpp checkout -q FETCH_HEAD  # pinned (store/legal/DEPENDENCIES.md, N-28)
            (cd /tmp/godot-cpp && scons platform=linux target=template_debug arch=x86_64 custom_api_file=gdextension/extension_api-4-7.json -j8)
            (cd game/addons/lockcore_gd && GODOT_CPP=/tmp/godot-cpp scons platform=linux target=template_debug arch=x86_64 custom_api_file=/tmp/godot-cpp/gdextension/extension_api-4-7.json -j8)
          fi
      - name: Measure budgets
        run: python3 qa/budget/check_budget.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --out qa/out/budget
      - name: Step summary
        if: always()
        run: cat qa/out/budget/budget.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-budget
          path: qa/out/budget/
