name: game-android

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'platform/android/**'
      - '.github/workflows/game-android.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Override versionCode of the release AAB (default 10000 + run number, D-106). Must be higher than any upload to Play.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (cmdline-tools, platform 36, build-tools 36.1.0, NDK 29.0.14206865)
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools" "ndk;29.0.14206865"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Build haptics AAR
        run: |
          cd platform/android
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradlew ]; then
            curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o gradle-8.11.1-bin.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q gradle-8.11.1-bin.zip
            ln -sf gradle-8.11.1/bin/gradle gradlew
            chmod +x gradlew
          fi
          ./gradlew :lockwright-haptics:assembleRelease :lockwright-click-audio:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: lockwright-haptics-aar
          path: platform/android/lockwright-haptics/build/outputs/aar/lockwright-haptics-release.aar

      - name: Upload click-audio AAR
        uses: actions/upload-artifact@v4
        with:
          name: lockwright-click-audio-aar
          path: platform/android/lockwright-click-audio/build/outputs/aar/lockwright-click-audio-release.aar

  export-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plugin-aar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 36, build-tools 36.1.0)
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools" "ndk;28.1.13356709"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lockwright-haptics-aar
          path: game/addons/lockwright_haptics/android
      - uses: actions/download-artifact@v4
        with:
          name: lockwright-click-audio-aar
          path: game/addons/lockwright_click_audio/android
      - name: Normalize AAR names (R-41e)
        run: |
          mv game/addons/lockwright_haptics/android/lockwright-haptics-release.aar game/addons/lockwright_haptics/android/lockwright_haptics.aar 2>/dev/null || true
          mv game/addons/lockwright_click_audio/android/lockwright-click-audio-release.aar game/addons/lockwright_click_audio/android/lockwright_click_audio.aar 2>/dev/null || true

      - name: Install Godot 4.7.2 + templates
        run: |
          mkdir -p /tmp/godot
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot && chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/godot/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/godot/templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates
          echo "4.7.2.stable.official.ed1daf0bf" > ~/.local/share/godot/export_templates/4.7.2.stable/version.txt

      - name: Build lockcore_gd for Android arm64
        run: |
          pip install scons
          git init -q /tmp/godot-cpp && git -C /tmp/godot-cpp fetch -q --depth 1 https://github.com/godotengine/godot-cpp.git e103d348c4b2d8df7b819126d855e19381cb9a87 && git -C /tmp/godot-cpp checkout -q FETCH_HEAD
          cd /tmp/godot-cpp
          scons platform=android target=template_debug arch=arm64 ndk_version=28.1.13356709 custom_api_file=gdextension/extension_api-4-7.json -j8
          cd $GITHUB_WORKSPACE/game/addons/lockcore_gd
          GODOT_CPP=/tmp/godot-cpp scons platform=android target=template_debug arch=arm64 ndk_version=28.1.13356709 custom_api_file=/tmp/godot-cpp/gdextension/extension_api-4-7.json -j8
          mkdir -p bin

      - name: Install Android build template into project
        run: |
          cd game
          mkdir -p android/build
          unzip -oq ~/.local/share/godot/export_templates/4.7.2.stable/android_source.zip -d android/build
          echo "4.7.2.stable" > android/.build_version
          find android -name "*.import" -delete

      - name: Editor settings (SDK/Java paths) + stable debug keystore
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
          # N-43/BUG-14: one stable debug key so `adb install -r` updates keep the save
          if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > /tmp/debug.keystore
          else
            cp platform/android/debug.keystore /tmp/debug.keystore
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Import + export debug APK
        run: |
          mkdir -p game/build
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --import
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game \
            --export-debug "Android" build/lockwright-debug.apk

      - name: Assert APK manifest has VIBRATE (N-55)
        run: |
          AAPT2=$ANDROID_HOME/build-tools/36.1.0/aapt2
          $AAPT2 dump permissions game/build/lockwright-debug.apk | tee /tmp/apk-perms.txt
          grep -q "android.permission.VIBRATE" /tmp/apk-perms.txt || { echo "::error::android.permission.VIBRATE missing from APK manifest (N-55)"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lockwright-android-debug
          path: game/build/lockwright-debug.apk

  release-aab:
    # Release AAB for Google Play (D-106, docs/handoff/PLAY-CLOSED-TEST.md). Signed with the upload key from
    # GitHub Secrets when present (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS;
    # optional ANDROID_KEY_PASSWORD must equal the store password - Godot's Gradle template uses one password).
    # Without secrets the AAB is unsigned (Play rejects it, but the build and all gates still run).
    # versionCode = 10000 + run number (monotonic; override via workflow_dispatch input), versionName from
    # the latest v* tag (+ "-ci.<run>" when HEAD is not that tag).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plugin-aar
    env:
      BUNDLETOOL_VERSION: 1.18.3
      BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # versionName comes from the latest v* tag

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 36, build-tools 36.1.0, NDK 28.1)
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools" "ndk;28.1.13356709"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> $GITHUB_ENV

      - name: Download AARs
        uses: actions/download-artifact@v4
        with:
          name: lockwright-haptics-aar
          path: game/addons/lockwright_haptics/android
      - uses: actions/download-artifact@v4
        with:
          name: lockwright-click-audio-aar
          path: game/addons/lockwright_click_audio/android
      - name: Normalize AAR names (R-41e)
        run: |
          mv game/addons/lockwright_haptics/android/lockwright-haptics-release.aar game/addons/lockwright_haptics/android/lockwright_haptics.aar 2>/dev/null || true
          mv game/addons/lockwright_click_audio/android/lockwright-click-audio-release.aar game/addons/lockwright_click_audio/android/lockwright_click_audio.aar 2>/dev/null || true

      - name: Install Godot 4.7.2 + templates
        run: |
          mkdir -p /tmp/godot
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot && chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/godot/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/godot/templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates
          echo "4.7.2.stable.official.ed1daf0bf" > ~/.local/share/godot/export_templates/4.7.2.stable/version.txt

      - name: Build lockcore_gd for Android arm64 (release)
        run: |
          pip install scons
          git init -q /tmp/godot-cpp && git -C /tmp/godot-cpp fetch -q --depth 1 https://github.com/godotengine/godot-cpp.git e103d348c4b2d8df7b819126d855e19381cb9a87 && git -C /tmp/godot-cpp checkout -q FETCH_HEAD
          cd /tmp/godot-cpp
          scons platform=android target=template_release arch=arm64 ndk_version=28.1.13356709 custom_api_file=gdextension/extension_api-4-7.json -j8
          cd $GITHUB_WORKSPACE/game/addons/lockcore_gd
          GODOT_CPP=/tmp/godot-cpp scons platform=android target=template_release arch=arm64 ndk_version=28.1.13356709 custom_api_file=/tmp/godot-cpp/gdextension/extension_api-4-7.json -j8
          mkdir -p bin
          cp bin/liblockcore_gd.android.template_release.so bin/liblockcore_gd.android.template_debug.so 2>/dev/null || true

      - name: Install Android build template into project
        run: |
          cd game
          mkdir -p android/build
          unzip -oq ~/.local/share/godot/export_templates/4.7.2.stable/android_source.zip -d android/build
          echo "4.7.2.stable" > android/.build_version
          find android -name "*.import" -delete

      - name: Editor settings (SDK/Java paths)
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres

      - name: Release keystore from GitHub Secrets (unsigned AAB when absent)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - unsigned AAB (Play Console will not accept it). See docs/handoff/PLAY-CLOSED-TEST.md section 1."
            echo "HAS_KEYSTORE=0" >> $GITHUB_ENV
            exit 0
          fi
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::secret $v is missing (needed with ANDROID_KEYSTORE_BASE64)"; exit 1; }
          done
          if [ -n "$ANDROID_KEY_PASSWORD" ] && [ "$ANDROID_KEY_PASSWORD" != "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEY_PASSWORD differs from ANDROID_KEYSTORE_PASSWORD; Godot signs with one password for store and key. Use a PKCS12 keystore (same password) - PLAY-CLOSED-TEST.md section 1."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          keytool -list -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null || { echo "::error::keystore does not open with ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS"; exit 1; }
          echo "HAS_KEYSTORE=1" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> $GITHUB_ENV

      - name: Version (versionCode = 10000 + run number, versionName from v* tag) and release preset
        env:
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: |
          RUN=${{ github.run_number }}
          CODE=${VERSION_CODE_INPUT:-$((10000 + RUN))}
          TAG=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo "v0.1.0")
          BASE=${TAG#v}
          if git describe --tags --exact-match --match 'v[0-9]*' HEAD > /dev/null 2>&1; then VER="$BASE"; else VER="$BASE-ci.$RUN"; fi
          SIGNED_FLAG=""; [ "$HAS_KEYSTORE" = "1" ] && SIGNED_FLAG="--signed"
          # one source of truth: copy of preset.0 "Android" (filters, VIBRATE + INTERNET, orientation), next free index
          python3 tools/release/android_release_preset.py --version-code "$CODE" --version-name "$VER" $SIGNED_FLAG
          echo "VERSION_CODE=$CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VER" >> $GITHUB_ENV
          echo "version: $VER (code $CODE), signed: $HAS_KEYSTORE"

      - name: Import + export release AAB
        env:
          # Godot reads these when the preset's keystore fields are empty; passwords never go into a file.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.KEYSTORE_PATH }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p game/build
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --import
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release "AndroidRelease" build/lockwright-release.aab
          test -f game/build/lockwright-release.aab || { echo "::error::AAB export failed"; exit 1; }
          git checkout -- game/export_presets.cfg

      - name: Release gate - manifest, permissions allowlist, 64-bit only, 16 KB pages, signing (D-106)
        run: |
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          REQ=""; [ "$HAS_KEYSTORE" = "1" ] && REQ="--require-signed"
          python3 tools/release/check_aab.py --aab game/build/lockwright-release.aab --bundletool "$RUNNER_TEMP/bundletool.jar" --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" $REQ --summary "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_KEYSTORE" = "1" ]; then
            jarsigner -verify game/build/lockwright-release.aab > /dev/null || { echo "::error::jarsigner -verify failed"; exit 1; }
            echo "### Upload certificate (register in Play Console as the upload key)" >> $GITHUB_STEP_SUMMARY
            keytool -printcert -jarfile game/build/lockwright-release.aab | grep -E "Owner:|SHA256:" | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          fi

      - name: AAB size budget (D-96/D-99, qa/budget/budgets.json aab_release_mb)
        run: python3 qa/budget/check_budget.py --aab game/build/lockwright-release.aab --size-only

      - name: Package size report
        run: |
          echo "## Package sizes" >> $GITHUB_STEP_SUMMARY
          ls -la game/build/ | tee /dev/stderr
          du -h game/build/lockwright-release.aab >> $GITHUB_STEP_SUMMARY

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: lockwright-android-release-aab
          path: game/build/lockwright-release.aab
