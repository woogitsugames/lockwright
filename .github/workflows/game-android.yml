name: game-android

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'platform/android/**'
      - '.github/workflows/game-android.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (cmdline-tools, platform 36, build-tools 36.1.0, NDK 29.0.14206865)
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools" "ndk;29.0.14206865"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Build haptics AAR
        run: |
          cd platform/android
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradlew ]; then
            curl -sL -o gradle-8.11.1-bin.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q gradle-8.11.1-bin.zip
            ln -sf gradle-8.11.1/bin/gradle gradlew
            chmod +x gradlew
          fi
          ./gradlew :lockwright-haptics:assembleRelease :lockwright-click-audio:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: lockwright-haptics-aar
          path: platform/android/lockwright-haptics/build/outputs/aar/lockwright-haptics-release.aar

      - name: Upload click-audio AAR
        uses: actions/upload-artifact@v4
        with:
          name: lockwright-click-audio-aar
          path: platform/android/lockwright-click-audio/build/outputs/aar/lockwright-click-audio-release.aar

  export-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plugin-aar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 36, build-tools 36.1.0)
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools" "ndk;28.1.13356709"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lockwright-haptics-aar
          path: game/addons/lockwright_haptics/android
      - uses: actions/download-artifact@v4
        with:
          name: lockwright-click-audio-aar
          path: game/addons/lockwright_click_audio/android
      - name: Normalize AAR names (R-41e)
        run: |
          mv game/addons/lockwright_haptics/android/lockwright-haptics-release.aar game/addons/lockwright_haptics/android/lockwright_haptics.aar 2>/dev/null || true
          mv game/addons/lockwright_click_audio/android/lockwright-click-audio-release.aar game/addons/lockwright_click_audio/android/lockwright_click_audio.aar 2>/dev/null || true

      - name: Install Godot 4.7.2 + templates
        run: |
          mkdir -p /tmp/godot
          curl -sL -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot && chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -sL -o /tmp/godot/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/godot/templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates
          echo "4.7.2.stable.official.ed1daf0bf" > ~/.local/share/godot/export_templates/4.7.2.stable/version.txt

      - name: Build lockcore_gd for Android arm64
        run: |
          pip install scons
          git init -q /tmp/godot-cpp && git -C /tmp/godot-cpp fetch -q --depth 1 https://github.com/godotengine/godot-cpp.git e103d348c4b2d8df7b819126d855e19381cb9a87 && git -C /tmp/godot-cpp checkout -q FETCH_HEAD
          cd /tmp/godot-cpp
          scons platform=android target=template_debug arch=arm64 ndk_version=28.1.13356709 custom_api_file=gdextension/extension_api-4-7.json -j8
          cd $GITHUB_WORKSPACE/game/addons/lockcore_gd
          GODOT_CPP=/tmp/godot-cpp scons platform=android target=template_debug arch=arm64 ndk_version=28.1.13356709 custom_api_file=/tmp/godot-cpp/gdextension/extension_api-4-7.json -j8
          mkdir -p bin

      - name: Install Android build template into project
        run: |
          cd game
          mkdir -p android/build
          unzip -oq ~/.local/share/godot/export_templates/4.7.2.stable/android_source.zip -d android/build
          echo "4.7.2.stable" > android/.build_version
          find android -name "*.import" -delete

      - name: Editor settings (SDK/Java paths) + stable debug keystore
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
          # N-43/BUG-14: one stable debug key so `adb install -r` updates keep the save
          if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > /tmp/debug.keystore
          else
            cp platform/android/debug.keystore /tmp/debug.keystore
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Import + export debug APK
        run: |
          mkdir -p game/build
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --import
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game \
            --export-debug "Android" build/lockwright-debug.apk

      - name: Assert APK manifest has VIBRATE (N-55)
        run: |
          AAPT2=$ANDROID_HOME/build-tools/36.1.0/aapt2
          $AAPT2 dump permissions game/build/lockwright-debug.apk | tee /tmp/apk-perms.txt
          grep -q "android.permission.VIBRATE" /tmp/apk-perms.txt || { echo "::error::android.permission.VIBRATE missing from APK manifest (N-55)"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lockwright-android-debug
          path: game/build/lockwright-debug.apk

  release-aab:
    # Task 8: gradle release + AAB. Signs with GitHub Secrets when present
    # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
    # ANDROID_KEY_PASSWORD); without them the step is skipped without failing.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plugin-aar
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # version comes from the tag

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 36, build-tools 36.1.0, NDK 28.1)
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools" "ndk;28.1.13356709"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> $GITHUB_ENV

      - name: Download AARs
        uses: actions/download-artifact@v4
        with:
          name: lockwright-haptics-aar
          path: game/addons/lockwright_haptics/android
      - uses: actions/download-artifact@v4
        with:
          name: lockwright-click-audio-aar
          path: game/addons/lockwright_click_audio/android
      - name: Normalize AAR names (R-41e)
        run: |
          mv game/addons/lockwright_haptics/android/lockwright-haptics-release.aar game/addons/lockwright_haptics/android/lockwright_haptics.aar 2>/dev/null || true
          mv game/addons/lockwright_click_audio/android/lockwright-click-audio-release.aar game/addons/lockwright_click_audio/android/lockwright_click_audio.aar 2>/dev/null || true

      - name: Install Godot 4.7.2 + templates
        run: |
          mkdir -p /tmp/godot
          curl -sL -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot && chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -sL -o /tmp/godot/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/godot/templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates
          echo "4.7.2.stable.official.ed1daf0bf" > ~/.local/share/godot/export_templates/4.7.2.stable/version.txt

      - name: Build lockcore_gd for Android arm64 (release)
        run: |
          pip install scons
          git init -q /tmp/godot-cpp && git -C /tmp/godot-cpp fetch -q --depth 1 https://github.com/godotengine/godot-cpp.git e103d348c4b2d8df7b819126d855e19381cb9a87 && git -C /tmp/godot-cpp checkout -q FETCH_HEAD
          cd /tmp/godot-cpp
          scons platform=android target=template_release arch=arm64 ndk_version=28.1.13356709 custom_api_file=gdextension/extension_api-4-7.json -j8
          cd $GITHUB_WORKSPACE/game/addons/lockcore_gd
          GODOT_CPP=/tmp/godot-cpp scons platform=android target=template_release arch=arm64 ndk_version=28.1.13356709 custom_api_file=/tmp/godot-cpp/gdextension/extension_api-4-7.json -j8
          mkdir -p bin
          cp bin/liblockcore_gd.android.template_release.so bin/liblockcore_gd.android.template_debug.so 2>/dev/null || true

      - name: Install Android build template into project
        run: |
          cd game
          mkdir -p android/build
          unzip -oq ~/.local/share/godot/export_templates/4.7.2.stable/android_source.zip -d android/build
          echo "4.7.2.stable" > android/.build_version
          find android -name "*.import" -delete

      - name: Editor settings (SDK/Java paths)
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres

      - name: Release keystore from GitHub Secrets (skipped when absent)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret - release signing skipped (unsigned AAB)."
            echo "HAS_KEYSTORE=0" >> $GITHUB_ENV
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          echo "HAS_KEYSTORE=1" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV

      - name: Release preset (version from tag, AAB, signing when keystore present)
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          VER=${TAG#v}
          CODE=$(git rev-list --count "$TAG..HEAD" 2>/dev/null || echo 1); CODE=$((1000 + CODE))
          # N-30 bis: same include/exclude filters as preset.0 "Android" (one source of truth)
          INC=$(awk -F'"' '/^\[preset.0\]/{f=1} f&&/^include_filter=/{print $2; exit}' game/export_presets.cfg)
          EXCL=$(awk -F'"' '/^\[preset.0\]/{f=1} f&&/^exclude_filter=/{print $2; exit}' game/export_presets.cfg)
          test -n "$EXCL" || { echo "::error::preset.0 exclude_filter not found"; exit 1; }
          KS_LINE=""
          SIGNED="false"
          if [ "$HAS_KEYSTORE" = "1" ]; then
            KS_LINE="keystore/release=\"$KEYSTORE_PATH\"\nkeystore/release_user=\"$ANDROID_KEY_ALIAS\"\nkeystore/release_password=\"$ANDROID_KEYSTORE_PASSWORD\"\n"
            SIGNED="true"
          fi
          printf '\n[preset.3]\nname="AndroidRelease"\nplatform="Android"\nrunnable=false\nexport_filter="all_resources"\ninclude_filter="'"$INC"'"\nexclude_filter="'"$EXCL"'"\nexport_path="build/lockwright-release.aab"\nencrypt_pck=false\nencrypt_directory=false\n\n[preset.3.options]\ngradle_build/use_gradle_build=true\ngradle_build/export_format=1\ngradle_build/min_sdk="30"\ngradle_build/target_sdk="36"\narchitectures/arm64-v8a=true\narchitectures/armeabi-v7a=false\narchitectures/x86=false\narchitectures/x86_64=false\nkeystore/debug=""\nkeystore/debug_user=""\nkeystore/debug_password=""\n'"$KS_LINE"'package/signed='"$SIGNED"'\nversion/code='"$CODE"'\nversion/name="'"$VER"'"\npackage/unique_name="com.woogitsugames.lockwright"\npackage/name="Lockwright: Locksmith on Call"\ngraphics/opengl_debug=false\nxr_features/xr_mode=0\npermissions/vibrate=true\n' >> game/export_presets.cfg
          # N-55: the release preset must keep VIBRATE (haptics), like preset.0
          awk '/^\[preset.3.options\]/{f=1} f&&/^permissions\/vibrate=true/{ok=1} END{exit !ok}' game/export_presets.cfg
          echo "version: $VER (code $CODE), keystore: $HAS_KEYSTORE (package/signed=$SIGNED - unsigned AAB when no release secrets)"

      - name: Import + export release AAB
        run: |
          mkdir -p game/build
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --import
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release "AndroidRelease" build/lockwright-release.aab

      - name: Assert AAB manifest has VIBRATE (N-55)
        run: |
          # base/manifest/AndroidManifest.xml in an AAB is protobuf; permission names are plain UTF-8
          unzip -p game/build/lockwright-release.aab base/manifest/AndroidManifest.xml > /tmp/aab-manifest.pb
          grep -aq "android.permission.VIBRATE" /tmp/aab-manifest.pb || { echo "::error::android.permission.VIBRATE missing from AAB manifest (N-55)"; exit 1; }
          echo "AAB manifest: android.permission.VIBRATE present"

      - name: AAB size budget (D-96, qa/budget/budgets.json aab_release_mb)
        run: python3 qa/budget/check_budget.py --aab game/build/lockwright-release.aab --size-only

      - name: Package size report
        run: |
          echo "## Package sizes" >> $GITHUB_STEP_SUMMARY
          ls -la game/build/ | tee /dev/stderr
          du -h game/build/lockwright-release.aab >> $GITHUB_STEP_SUMMARY

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: lockwright-android-release-aab
          path: game/build/lockwright-release.aab
