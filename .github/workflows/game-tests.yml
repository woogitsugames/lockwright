name: game-tests

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'lockcore/**'
      - 'data/**'
      - 'audio/tools/**'
      - '.github/workflows/game-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gdextension-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scons
      - name: Clone + build godot-cpp (API 4.7, pinned N-28)
        run: |
          git init -q /tmp/godot-cpp && git -C /tmp/godot-cpp fetch -q --depth 1 https://github.com/godotengine/godot-cpp.git e103d348c4b2d8df7b819126d855e19381cb9a87 && git -C /tmp/godot-cpp checkout -q FETCH_HEAD
          cd /tmp/godot-cpp
          scons platform=linux target=template_debug arch=x86_64 custom_api_file=gdextension/extension_api-4-7.json -j8
      - name: Build lockcore_gd GDExtension
        run: |
          cd game/addons/lockcore_gd
          GODOT_CPP=/tmp/godot-cpp scons platform=linux target=template_debug arch=x86_64 custom_api_file=/tmp/godot-cpp/gdextension/extension_api-4-7.json -j8
      - name: Install Godot 4.7.2 + templates
        run: |
          mkdir -p /tmp/godot
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot && chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/godot/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/godot/templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates
          echo "4.7.2.stable.official.ed1daf0bf" > ~/.local/share/godot/export_templates/4.7.2.stable/version.txt
      - name: Run lock session test through real lockcore
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --import
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game res://tests/lock_test.tscn
      - name: Upload lockcore_gd .so (R-47)
        uses: actions/upload-artifact@v4
        with:
          name: lockcore-gd-linux-debug
          path: game/addons/lockcore_gd/bin/liblockcore_gd.linux.template_debug.so

  gdscript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: gdextension-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lockcore-gd-linux-debug
          path: game/addons/lockcore_gd/bin

      - name: Install Godot 4.7.2 + templates
        run: |
          mkdir -p /tmp/godot
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot && chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/godot/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/godot/templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates
          echo "4.7.2.stable.official.ed1daf0bf" > ~/.local/share/godot/export_templates/4.7.2.stable/version.txt

      - name: Import project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --import

      - name: Smoke test
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game res://tests/smoke.tscn

      - name: GUT tests
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game -s res://addons/gut/gut_cmdln.gd -gdir=res://tests/gut -gexit

  export-pack-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: gdextension-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lockcore-gd-linux-debug
          path: game/addons/lockcore_gd/bin
      - name: Install Godot 4.7.2 + templates
        run: |
          mkdir -p /tmp/godot
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot && chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/godot/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/godot/templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates
          cp ~/.local/share/godot/export_templates/4.7.2.stable/version.txt /tmp/vt && head -1 /tmp/vt
      - name: Export-pack + run smoke from pck (R-15, R-28; preset.2 "Linux" is in game/export_presets.cfg)
        run: |
          mkdir -p game/build
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --import
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-debug "Linux" build/lockwright-debug.pck
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --main-pack game/build/lockwright-debug.pck res://tests/smoke.tscn

  data-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate content data
        run: python3 data/tools/validate.py
      - name: Localization QA
        run: python3 data/tools/loc_qa.py
      - name: Content pack sources (D-112, game/packs/<id>/)
        run: python3 tools/build_content_packs.py --check
      - name: Haptics budget validator (haptics/validate.py, task 4)
        run: python3 haptics/validate.py
      - name: Haptics detail files in game match haptics/out
        run: |
          python3 - <<'EOF'
          import json, hashlib, sys
          idx = json.load(open('haptics/out/index.json'))
          missing = []
          checked = 0
          for fam, fdata in idx['families'].items():
              for ev, edata in fdata['events'].items():
                  for key in ('android', 'ios', 'ios_mod'):
                      ref = edata.get(key)
                      files = ref if isinstance(ref, list) else ([ref] if ref else [])
                      for f in files:
                          p = 'game/data/haptics/' + f['file']
                          try:
                              h = hashlib.sha256(open(p, 'rb').read()).hexdigest()
                          except OSError:
                              missing.append(p); continue
                          checked += 1
                          if h != f['sha256']:
                              missing.append(p + ' (hash mismatch)')
          if missing:
              print('MISMATCH:\n' + '\n'.join(missing)); sys.exit(1)
          print('haptics detail files OK:', checked, 'checked via index.json')
          EOF

  audio-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install soundfile numpy
      - name: Check SFX format and click latency constraints
        run: python3 audio/tools/check_sfx.py
