name: lockcore

on:
  push:
    branches: [main]
    paths: ["lockcore/**", ".github/workflows/lockcore.yml"]
  pull_request:
    paths: ["lockcore/**", ".github/workflows/lockcore.yml"]
  schedule:
    - cron: "17 2 * * *"  # nightly: full 10 000 seeds per family and tier
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S lockcore -B lockcore/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build lockcore/build --parallel
      - name: Unit tests, golden replays, no-float check
        run: ctest --test-dir lockcore/build --output-on-failure
      - name: verify_seeds (fast, 1000 seeds)
        if: github.event_name != 'schedule'
        run: lockcore/build/verify_seeds --seeds 1000 --csv verify_seeds.csv
      - name: verify_seeds (full, 10000 seeds)
        if: github.event_name == 'schedule'
        run: lockcore/build/verify_seeds --seeds 10000 --replays 1000 --csv verify_seeds.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-seeds-${{ matrix.compiler }}
          path: verify_seeds.csv

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan + UBSan)
        run: cmake -S lockcore -B lockcore/build-asan -DCMAKE_BUILD_TYPE=Debug -DLOCKCORE_SANITIZE=ON
      - name: Build
        run: cmake --build lockcore/build-asan --parallel
      - name: Tests
        run: ctest --test-dir lockcore/build-asan --output-on-failure
