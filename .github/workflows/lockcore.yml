name: lockcore

on:
  push:
    branches: [main]
    paths: ["lockcore/**", ".github/workflows/lockcore.yml"]
  pull_request:
    paths: ["lockcore/**", ".github/workflows/lockcore.yml"]
  schedule:
    - cron: "17 2 * * *"  # nightly: full 10 000 seeds per family and tier (all bots)
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S lockcore -B lockcore/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build lockcore/build --parallel
      - name: Unit tests, golden replays, no-float check
        run: ctest --test-dir lockcore/build --output-on-failure
      # Hard gate: oracle + scripted bot, 0 failures. The clumsy and feeling bots
      # (verifier stage 3) are reported in the log and the CSV, not gated.
      - name: verify_seeds (fast, 1000 seeds, every family)
        if: github.event_name != 'schedule'
        shell: bash  # -o pipefail: tee must not hide the exit code
        run: lockcore/build/verify_seeds --seeds 1000 --csv verify_seeds.csv | tee verify_seeds.txt
      - name: verify_seeds (full, 10000 seeds, every family)
        if: github.event_name == 'schedule'
        shell: bash
        run: lockcore/build/verify_seeds --seeds 10000 --replays 1000 --csv verify_seeds.csv | tee verify_seeds.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-seeds-${{ matrix.compiler }}
          path: |
            verify_seeds.csv
            verify_seeds.txt

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan + UBSan)
        run: cmake -S lockcore -B lockcore/build-asan -DCMAKE_BUILD_TYPE=Debug -DLOCKCORE_SANITIZE=ON
      - name: Build
        run: cmake --build lockcore/build-asan --parallel
      - name: Tests (unit, golden replays, verify smoke)
        run: ctest --test-dir lockcore/build-asan --output-on-failure -E lockcore_fuzz
      - name: Fuzz (100k random steps per family, UB is fatal)
        run: ctest --test-dir lockcore/build-asan --output-on-failure -R lockcore_fuzz
