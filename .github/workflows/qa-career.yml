name: qa-career
# Session C, stage 3, task 3: headless career bot (qa/). Nightly + on changes to game/ or qa/.
# The bot plays the tutorial, all jobs, workshop purchases and the showcase on a COPY of game/;
# report (qa/out/report.md + report.json + full log) is uploaded as an artifact and shown in the summary.

on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'qa/**'
      - '.github/workflows/qa-career.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  career:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2
        run: |
          mkdir -p /tmp/godot
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Cache lockcore_gd (Linux)
        uses: actions/cache@v4
        with:
          path: game/addons/lockcore_gd/bin/liblockcore_gd.linux.template_debug.so
          key: lockcore-gd-linux-${{ hashFiles('lockcore/include/**', 'lockcore/src/**', 'game/addons/lockcore_gd/src/**', 'game/addons/lockcore_gd/include/**', 'game/addons/lockcore_gd/SConstruct') }}
      - name: Rebuild lockcore_gd (Linux) if the checked-in binary is missing
        run: |
          if [ ! -f game/addons/lockcore_gd/bin/liblockcore_gd.linux.template_debug.so ]; then
            pip install scons
            git init -q /tmp/godot-cpp && git -C /tmp/godot-cpp fetch -q --depth 1 https://github.com/godotengine/godot-cpp.git e103d348c4b2d8df7b819126d855e19381cb9a87 && git -C /tmp/godot-cpp checkout -q FETCH_HEAD  # pinned (store/legal/DEPENDENCIES.md, N-28)
            (cd /tmp/godot-cpp && scons platform=linux target=template_debug arch=x86_64 custom_api_file=gdextension/extension_api-4-7.json -j8)
            (cd game/addons/lockcore_gd && GODOT_CPP=/tmp/godot-cpp scons platform=linux target=template_debug arch=x86_64 custom_api_file=/tmp/godot-cpp/gdextension/extension_api-4-7.json -j8)
          fi
      - name: Build lockcore tools (replay_tool for the feel/clumsy player profiles)
        run: |
          cmake -S lockcore -B lockcore/build -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build lockcore/build --target replay_tool -j4
      - name: Assets check (G07 arrival backgrounds, G09 portraits, S03 voices, every sound file)
        run: python3 qa/assets/check_assets.py --out qa/out/assets
      - name: Run career matrix (solver, feel, clumsy, EN, in the dark)
        env:
          QA_WORK: ${{ runner.temp }}/lw_qa_game
          QA_FAIL_ON_INFRA: '1'  # game findings -> warnings + report; red only if the bot/engine/workflow fails
          QA_TIMEOUT: '1500'
        run: qa/run_matrix.sh /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 lockcore/build/replay_tool
      - name: Step summary
        if: always()
        run: |
          if [ -f qa/out/matrix.md ]; then cat qa/out/matrix.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f qa/out/solver/report.md ]; then cat qa/out/solver/report.md >> "$GITHUB_STEP_SUMMARY"; else echo "no report" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f qa/out/assets/report.md ]; then cat qa/out/assets/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-career-report
          path: qa/out/
          retention-days: 30
