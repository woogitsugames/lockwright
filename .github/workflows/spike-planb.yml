name: spike-planb

# Task 4 of session C stage 2: performance APK of the plan B lock screen (D-31) from session A's scene
# game/scenes/photoreal/lock_photoreal.tscn. Built from a COPY of game/ with a perf HUD overlay
# (spikes/planb-perf/apply_overlay.sh); game/ itself is not changed.
on:
  push:
    branches: [main]
    paths:
      - 'game/scenes/photoreal/**'
      - 'game/scripts/photoreal/**'
      - 'game/assets/**'
      - 'spikes/planb-perf/**'
      - '.github/workflows/spike-planb.yml'
  workflow_dispatch:

env:
  GODOT: Godot_v4.7.2-stable_linux.x86_64
  NDK_VERSION: 29.0.14206865

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (platform 36, build-tools 36.1.0)
        run: |
          SDK=$RUNNER_TEMP/android-sdk
          mkdir -p $SDK/cmdline-tools
          curl -sL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $SDK/cmdline-tools && mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: NDK (lockcore_gd arm64)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION" > /dev/null
      - name: Cache lockcore_gd (Android arm64)
        id: cache
        uses: actions/cache@v4
        with:
          path: game/addons/lockcore_gd/bin/liblockcore_gd.android.template_debug.so
          key: lockcore-gd-android-${{ hashFiles('lockcore/include/**', 'lockcore/src/**', 'game/addons/lockcore_gd/src/**', 'game/addons/lockcore_gd/include/**', 'game/addons/lockcore_gd/SConstruct') }}
      # GEM3 BUG-05: the .so is not in git, so the APK carried a 0-byte library and fell back to FakeLockSession
      - name: Build lockcore_gd (Android arm64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install scons
          git init -q /tmp/godot-cpp && git -C /tmp/godot-cpp fetch -q --depth 1 https://github.com/godotengine/godot-cpp.git e103d348c4b2d8df7b819126d855e19381cb9a87 && git -C /tmp/godot-cpp checkout -q FETCH_HEAD  # pinned (N-28)
          API=/tmp/godot-cpp/gdextension/extension_api-4-7.json
          (cd /tmp/godot-cpp && scons platform=android target=template_debug arch=arm64 ndk_version=$NDK_VERSION custom_api_file=$API -j8)
          cd game/addons/lockcore_gd
          GODOT_CPP=/tmp/godot-cpp scons platform=android target=template_debug arch=arm64 ndk_version=$NDK_VERSION custom_api_file=$API -j8
      - name: Godot 4.7.2 + templates + editor settings
        run: |
          mkdir -p /tmp/godot && cd /tmp/godot
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/$GODOT.zip
          unzip -q godot.zip && chmod +x $GODOT
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p $T && unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* $T/
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
      - name: Overlay (copy of game/ + perf HUD, plan B scene as main)
        run: spikes/planb-perf/apply_overlay.sh /tmp/planb
      - name: Export APK
        working-directory: /tmp/planb
        run: |
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          /tmp/godot/$GODOT --headless --path . --import
          mkdir -p build
          /tmp/godot/$GODOT --headless --path . --export-debug "Android" build/lw-planb-perf.apk
          unzip -l build/lw-planb-perf.apk | grep -E "liblockcore_gd|libgodot_android"
          # the native library must be real, not a 0-byte placeholder (GEM3 BUG-05)
          sz=$(unzip -l build/lw-planb-perf.apk | awk '/liblockcore_gd.android.template_debug.so/ {print $1}' | head -1)
          echo "liblockcore_gd in APK: ${sz:-missing} B"; [ "${sz:-0}" -gt 100000 ] || { echo "::error::liblockcore_gd missing or empty in the APK"; exit 1; }
      - name: Smoke screenshot (Xvfb + lavapipe)
        working-directory: /tmp/planb
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 > /dev/null
          mkdir -p /tmp/mv
          xvfb-run -s "-screen 0 1400x1800x24" timeout 600 /tmp/godot/$GODOT --path . --rendering-method mobile \
            --resolution 412x915 --write-movie /tmp/mv/f.png --quit-after 30 || true
          cp "$(ls /tmp/mv/*.png | tail -1)" build/planb_smoke.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: planb-perf-apk
          path: |
            /tmp/planb/build/lw-planb-perf.apk
            /tmp/planb/build/planb_smoke.png
          retention-days: 90
