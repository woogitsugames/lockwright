name: game-ios

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'platform/ios/**'
      - '.github/workflows/game-ios.yml'
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer 2>/dev/null || sudo xcode-select -s $(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer

      - name: Install Godot 4.7.2 + export templates
        run: |
          mkdir -p /tmp/godot
          curl -sL -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          curl -sL -o /tmp/godot/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/godot/export_templates/4.7.2.stable
          unzip -q /tmp/godot/templates.tpz -d ~/Library/Application\ Support/godot/export_templates/4.7.2.stable
          mv ~/Library/Application\ Support/godot/export_templates/4.7.2.stable/templates/* ~/Library/Application\ Support/godot/export_templates/4.7.2.stable/
          rmdir ~/Library/Application\ Support/godot/export_templates/4.7.2.stable/templates
          echo "4.7.2.stable.official.ed1daf0bf" > ~/Library/Application\ Support/godot/export_templates/4.7.2.stable/version.txt
          /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --version

      - name: Install iOS platform for xcodebuild
        run: sudo xcodebuild -downloadPlatform iOS || echo "platform already present or download failed, continuing"

      - name: Install scons
        run: |
          pip3 install --user scons || pip3 install --break-system-packages scons
          echo "$(python3 -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Clone godot-cpp (API 4.7 via custom_api_file, pinned N-28)
        run: |
          git init -q godot-cpp && git -C godot-cpp fetch -q --depth 1 https://github.com/godotengine/godot-cpp.git e103d348c4b2d8df7b819126d855e19381cb9a87 && git -C godot-cpp checkout -q FETCH_HEAD

      - name: Build godot-cpp (ios device, API 4.7)
        run: |
          cd godot-cpp
          scons platform=ios target=template_release arch=arm64 custom_api_file=gdextension/extension_api-4-7.json -j8
          scons platform=ios target=template_debug arch=arm64 custom_api_file=gdextension/extension_api-4-7.json -j8

      - name: "Build LockwrightHaptics GDExtension (D-30/D-42, .gdextension only in iOS build)"
        run: |
          cd platform/ios/lockwright_haptics
          GODOT_CPP_SCONSTRUCT=$GITHUB_WORKSPACE/godot-cpp/SConstruct scons platform=ios target=template_release arch=arm64 custom_api_file=$GITHUB_WORKSPACE/godot-cpp/gdextension/extension_api-4-7.json -j8
          GODOT_CPP_SCONSTRUCT=$GITHUB_WORKSPACE/godot-cpp/SConstruct scons platform=ios target=template_debug arch=arm64 custom_api_file=$GITHUB_WORKSPACE/godot-cpp/gdextension/extension_api-4-7.json -j8
          mkdir -p bin ../../../game/addons/lockwright_haptics/ios
          xcodebuild -create-xcframework \
            -library bin/liblockwright_haptics.ios.template_release.dylib \
            -output ../../../game/addons/lockwright_haptics/ios/liblockwright_haptics.ios.release.xcframework
          xcodebuild -create-xcframework \
            -library bin/liblockwright_haptics.ios.template_debug.dylib \
            -output ../../../game/addons/lockwright_haptics/ios/liblockwright_haptics.ios.debug.xcframework
          printf '[configuration]\nentry_symbol = "lockwright_haptics_init"\ncompatibility_minimum = "4.7"\n\n[libraries]\nios.debug = "res://addons/lockwright_haptics/ios/liblockwright_haptics.ios.debug.xcframework"\nios.release = "res://addons/lockwright_haptics/ios/liblockwright_haptics.ios.release.xcframework"\n' > ../../../game/addons/lockwright_haptics/lockwright_haptics.gdextension

      - name: Build lockcore_gd xcframeworks (iOS)
        run: |
          cd game/addons/lockcore_gd
          GODOT_CPP=$GITHUB_WORKSPACE/godot-cpp scons platform=ios target=template_release arch=arm64 custom_api_file=$GITHUB_WORKSPACE/godot-cpp/gdextension/extension_api-4-7.json -j8
          GODOT_CPP=$GITHUB_WORKSPACE/godot-cpp scons platform=ios target=template_debug arch=arm64 custom_api_file=$GITHUB_WORKSPACE/godot-cpp/gdextension/extension_api-4-7.json -j8
          mkdir -p bin
          xcodebuild -create-xcframework \
            -library bin/liblockcore_gd.ios.template_release.dylib \
            -output bin/liblockcore_gd.ios.release.xcframework
          xcodebuild -create-xcframework \
            -library bin/liblockcore_gd.ios.template_debug.dylib \
            -output bin/liblockcore_gd.ios.debug.xcframework

      - name: Import + export Godot project to Xcode (unsigned)
        continue-on-error: true
        env:
          CODE_SIGNING_ALLOWED: 'NO'
        run: |
          mkdir -p game/build
          /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --path game --import
          CODE_SIGNING_ALLOWED=NO /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --path game --export-debug "iOS" build/lockwright-debug.ipa

      - name: Compile exported Xcode project (CODE_SIGNING_ALLOWED=NO)
        run: |
          cd game/build
          xcodebuild -project lockwright-debug.xcodeproj -scheme lockwright-debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -allowProvisioningUpdates \
            build 2>&1 | tail -30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lockwright-ios-debug
          path: |
            build/lockwright-debug.ipa
            game/addons/lockwright_haptics/ios/*.xcframework
