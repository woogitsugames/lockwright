ke-width="2"/><path d="M165 855H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 930H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1005H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1080H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1155H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1230H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1305H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1380H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1455H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1530H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1605H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1680H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1755H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1830H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1905H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 1980H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M165 2055H1467" stroke="#657e92" stroke-opacity=".23" stroke-width="2"/><path d="M272 142V2090" stroke="#ac6756" opacity=".38" stroke-width="4"/><text x="261" y="306" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="70" font-weight="700" fill="#37342d" transform="rotate(-1 261 306)">Master Henryk’s five rules</text><text x="250" y="486" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="62" font-weight="700" fill="#37342d" transform="rotate(0 250 486)">1.</text><text x="341" y="486" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="48" font-weight="400" fill="#37342d" transform="rotate(-0.5 341 486)">First ask whose it is. Then look at the</text><text x="341" y="561" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="48" font-weight="400" fill="#37342d" transform="rotate(0 341 561)">lock.</text><text x="250" y="768" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="62" font-weight="700" fill="#37342d" transform="rotate(0 250 768)">2.</text><text x="341" y="768" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="48" font-weight="400" fill="#37342d" transform="rotate(0 341 768)">One paper is a hint. Two is a</text><text x="341" y="843" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="48" font-weight="400" fill="#37342d" transform="rotate(0.5 341 843)">conversation. A neighbour is certainty.</text><text x="250" y="1050" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="62" font-weight="700" fill="#37342d" transform="rotate(0 250 1050)">3.</text><text x="341" y="1050" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="48" font-weight="400" fill="#37342d" transform="rotate(0.5 341 1050)">Whoever pays to skip questions is paying</text><text x="341" y="1125" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="48" font-weight="400" fill="#37342d" transform="rotate(-0.5 341 1125)">for someone else's door.</text><text x="250" y="1332" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="62" font-weight="700" fill="#37342d" transform="rotate(0 250 1332)">4.</text><text x="341" y="1332" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="48" font-weight="400" fill="#37342d" transform="rotate(-0.5 341 1332)">Quote before work. No surprises on the</text><text x="341" y="1407" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="48" font-weight="400" fill="#37342d" transform="rotate(0 341 1407)">bill.</text><text x="250" y="1614" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="62" font-weight="700" fill="#37342d" transform="rotate(0 250 1614)">5.</text><text x="341" y="1614" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="48" font-weight="400" fill="#37342d" transform="rotate(0 341 1614)">What I saw inside stays inside.</text><text x="1096" y="1940" font-family="Comic Neue, Segoe Print, cursive" font-style="italic" font-size="80" font-weight="400" fill="#37342d" transform="rotate(-5 1096 1940)">H.</text></svg>