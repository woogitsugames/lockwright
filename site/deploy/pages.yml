# GitHub Pages publication for site/ — PREPARED, NOT ENABLED (needs the owner's consent).
# To enable: (1) repo Settings → Pages → Source: "GitHub Actions"; (2) fill the [placeholders] on the pages
# (contact, controller, dates); (3) move this file to .github/workflows/site-pages.yml and push.
name: site-pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/MARKETING.md', 'store/privacy.md', 'art/renders/**', 'mockups/realizm/png/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build and check
        run: python3 site/build.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
